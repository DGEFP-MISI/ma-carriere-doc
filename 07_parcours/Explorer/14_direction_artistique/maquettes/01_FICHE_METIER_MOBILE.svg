<svg xmlns="http://www.w3.org/2000/svg" width="375" height="3094" viewBox="0 0 375 3094" role="img" aria-labelledby="titre description"><title id="titre">01_FICHE_METIER_MOBILE.svg</title><desc id="description">Fiche métier existante, quatre questions enrichies de repères natifs, sources et accès aux approfondissements. Les actions et routes sont inchangées.</desc><rect width="375" height="3094" fill="white"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="375" height="80" rx="0" fill="white" stroke="#dddddd"/><text xml:space="preserve" x="24" y="47" font-size="25" fill="#161616" font-weight="700">MaCarrière</text><rect x="16" y="99" width="343" height="52" rx="0" fill="#f6f6f6" stroke="#dddddd"/><text xml:space="preserve" x="32" y="132" font-size="16" fill="#000091" font-weight="700">Modifier ma recherche</text><text xml:space="preserve" x="20" y="199" font-size="16" fill="#000091" font-weight="400">Les quatre questions sur ce</text><text xml:space="preserve" x="20" y="222" font-size="16" fill="#000091" font-weight="400">métier</text><text xml:space="preserve" x="20" y="263" font-size="30" fill="#161616" font-weight="700">Pose et</text><text xml:space="preserve" x="20" y="300" font-size="30" fill="#161616" font-weight="700">restauration de</text><text xml:space="preserve" x="20" y="337" font-size="30" fill="#161616" font-weight="700">couvertures</text><text xml:space="preserve" x="20" y="362" font-size="17" fill="#161616" font-weight="400">Comprenez le travail et les</text><text xml:space="preserve" x="20" y="386" font-size="17" fill="#161616" font-weight="400">possibilités</text><rect x="20" y="410" width="212" height="44" rx="0" fill="#000091" stroke="#000091"/><text xml:space="preserve" x="36" y="438" font-size="16" fill="white" font-weight="700">Garder cette piste</text><text xml:space="preserve" x="20" y="489" font-size="16" fill="#000091" font-weight="400">Comparer avec un autre métier</text><text xml:space="preserve" x="20" y="541" font-size="15"