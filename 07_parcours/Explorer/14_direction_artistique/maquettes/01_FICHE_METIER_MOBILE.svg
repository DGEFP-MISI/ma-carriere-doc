text xml:space="preserve" x="20" y="2696" font-size="16" fill="#000091" font-weight="400">Les certifications et formations</text><text xml:space="preserve" x="20" y="2752" font-size="16" fill="#000091" font-weight="400">Les secteurs qui emploient</text><rect x="0" y="2834" width="375" height="260" rx="0" fill="#f6f6f6" stroke="#dddddd"/><text xml:space="preserve" x="20" y="2864" font-size="15" fill="#161616" font-weight="700">Annotations de conception — hors</text><text xml:space="preserve" x="20" y="2886" font-size="15" fill="#161616" font-weight="700">écran citoyen</text><text xml:space="preserve" x="20" y="2920" font-size="14" fill="#666666" font-weight="400">Même navigation :</text><text xml:space="preserve" x="20" y="2941" font-size="14" fill="#666666" font-weight="400">US005/008/009/027/028. Les valeurs</text><text xml:space="preserve" x="20" y="2962" font-size="14" fill="#666666" font-weight="400">viennent de R16, pas du fichier HTML</text><text xml:space="preserve" x="20" y="2983" font-size="14" fill="#666666" font-weight="400">d’intention. Groupes et lieux</text><text xml:space="preserve" x="20" y="3004" font-size="14" fill="#666666" font-weight="400">restent distincts. Toutes les</text><text xml:space="preserve" x="20" y="3025" font-size="14" fill="#666666" font-weight="400">rubriques restent accessibles.</text></g></svg>