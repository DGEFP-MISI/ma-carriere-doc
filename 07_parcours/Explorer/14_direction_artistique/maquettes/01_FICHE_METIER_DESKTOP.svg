<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1698" viewBox="0 0 1440 1698" role="img" aria-labelledby="titre description"><title id="titre">01_FICHE_METIER_DESKTOP.svg</title><desc id="description">Fiche métier existante, quatre questions enrichies de repères natifs, sources et accès aux approfondissements. Les actions et routes sont inchangées.</desc><rect width="1440" height="1698" fill="white"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1440" height="80" rx="0" fill="white" stroke="#dddddd"/><text xml:space="preserve" x="48" y="47" font-size="25" fill="#161616" font-weight="700">MaCarrière</text><text xml:space="preserve" x="1180" y="45" font-size="16" fill="#000091" font-weight="700">Explorer</text><text xml:space="preserve" x="1300" y="45" font-size="16" fill="#000091" font-weight="700">Mes pistes</text><rect x="48" y="108" width="1344" height="94" rx="0" fill="#f6f6f6" stroke="#dddddd"/><text xml:space="preserve" x="68" y="137" font-size="15" fill="#000091" font-weight="400">Métier        Diplôme ou titre        Domaine professionnel</text><text xml:space="preserve" x="68" y="175" font-size="15" fill="#161616" font-weight="700">Un métier ou un nom de poste</text><text xml:space="preserve" x="1050" y="175" font-size="16" fill="#000091" font-weight="700">Rechercher</text><text xml:space="preserve" x="1180" y="175" font-size="13" fill="#000091" font-weight="400">Montpellier · changer de</text><text xml:space="preserve" x="1180" y="195" font-size="13" fill="#000091" font-weight="400">lieu</text><text xml:space="preserve" x="48" y="270" font-size="15" fill="#161616" font-weight="700">Vos questions</text><text xml:space="preserve" x="48" y="315" font-size="15" fill="#000091" font-weight="400">Que fait-on dans ce</text><text xml:space="preserve" x="48" y="337" font-size="15" fill="#000091" font-weight="400">métier ?</text><text xml:space="preserve" x="48" y="373" font-size="15" fill="#000091" font-weight="400">Où sont les opportunités</text><text xml:space="preserve" x="48" y="395" font-size="15" fill="#000091" font-weight="400">?</text><text xml:space="preserve" x="48" y="431" font-size="15" fill="#000091" font-weight="400">Combien gagne-t-on ?</text><text xml:space="preserve" x="48" y="489" font-size="15" fill="#000091" font-weight="400">Quelles autres pistes ?</text><text xml:space="preserve" x="48" y="547" font-size="15" fill="#000091" font-weight="400">Pour aller plus loin</text><text xml:space="preserve" x="320" y="286" font-size="42" fill="#161616" font-weight="700">Pose et restauration de couvertures</text><text xml:space="preserve" x="320" y="346" font-size="18" fill="#666666" font-weight="400">Comprenez le travail et regardez les possibilités qui comptent pour vous.</text><rect x="320" y="382" width="192" height="46" rx="0" fill="#000091" stroke="#000091"/><text xml:space="preserve" x="338" y="411" font-size="16" fill="white" font-weight="700">Garder cette piste</text><text xml:space="preserve" x="538" y="411" font-size="16" fill="#000091" font-weight="400">Comparer avec un autre métier</text><text xml:space="preserve" x="320" y="467" font-size="15" fill="#161616" font-weight="400">Montpellier · votre lieu choisi      Choisir un lieu</text><rect x="320" y="510" width="510" height="350" rx="0" fill="white" stroke="#dddddd"/><rect x="340" y="530" width="44" height="44" rx="0" fill="#e3fdeb" stroke="#e3fdeb"/><g transform="translate(350,540) scale(1.0)" fill="#297254" aria-hidden="true"><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M16 1a1 1 0 0 1 1 1v3h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4V2a1 1 0 0 1 1-1h8Zm4 15H4v3h16v-3Zm0-9H4v7h16V7Zm-7 4v2h-2v-2h2Zm2-8H9v2h6V3Z" /></g><text xml:space="preserve" x="340" y="610" font-size="22" fill="#161616" font-weight="700">Que fait-on dans ce métier ?</text><text xml:space="preserve" x="340" y="651" font-size="14" fill="#666666" font-weight="400">Quelques conditions mentionnées</text><text xml:space="preserve" x="340" y="687" font-size="18" fill="#161616" font-weight="700">En extérieur</text><text xml:space="preserve" x="340" y="715" font-size="18" fill="#161616" font-weight="700">En grande hauteur</text><text xml:space="preserve" x="340" y="743" font-size="18" fill="#161616" font-weight="700">Sur chantier</text><text xml:space="preserve" x="340" y="802" font-size="13" fill="#666666" font-weight="400">France Travail · description du métier</text><text xml:space="preserve" x="340" y="838" font-size="13" fill="#000091" font-weight="700">Les activités et les savoir-faire</text><g transform="translate(788,820) scale(1.0)" fill="#000091" aria-hidden="true"><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="m16.172 11-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2h12.172Z" /></g><rect x="854" y="510" width="510" height="350" rx="0" fill="white" stroke="#dddddd"/><rect x="874" y="530" width="44" height="44" rx="0" fill="#fff8e5" stroke="#fff8e5"/><g transform="translate(884,540) scale(1.0)" fill="#695240" aria-hidden="true"><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M18.364 3.636a9 9 0 0 1 0 12.728L12 22.728l-6.364-6.364A9 9 0 0 1 18.364 3.636ZM7.05 5.051a7 7 0 0 0 0 9.899L12 19.9l4.95-4.95a7 7 0 0 0-9.9-9.9ZM12 8a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z" /></g><text xml:space="preserve" x="874" y="610" font-size="22" fill="#161616" font-weight="700">Où sont les opportunités ?</text><text xml:space="preserve" x="874" y="651" font-size="27" fill="#161616" font-weight="700">26 projets</text><text xml:space="preserve" x="874" y="676" font-size="13" fill="#666666" font-weight="400">Couvreurs</text><text xml:space="preserve" x="874" y="737" font-size="27" fill="#161616" font-weight="700">81 projets</text><text xml:space="preserve" x="874" y="762" font-size="13" fill="#666666" font-weight="400">Techniciens et agents de maîtrise de chantiers</text><text xml:space="preserve" x="874" y="782" font-size="13" fill="#666666" font-weight="400">du BTP </text><text xml:space="preserve" x="874" y="805" font-size="13" fill="#666666" font-weight="400">Bassin de Montpellier · BMO 2026</text><text xml:space="preserve" x="874" y="838" font-size="13" fill="#000091" font-weight="700">Comprendre les besoins des employeurs</text><g transform="translate(1322,820) scale(1.0)" fill="#000091" aria-hidden="true"><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="m16.172 11-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2h12.172Z" /></g><rect x="320" y="884" width="510" height="350" rx="0" fill="white" stroke="#dddddd"/><rect x="340" y="904" width="44" height="44" rx="0" fill="#fef3fd" stroke="#fef3fd"/><g transform="translate(350,914) scale(1.0)" fill="#6e445a" aria-hidden="true"><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2Zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm3.815 4.457L14.114 9.59A2.5 2.5 0 0 0 10.05 11H15v2h-4.95a2.5 2.5 0 0 0 4.064 1.41l1.7 1.133A4.5 4.5 0 0 1 8.028 13H7v-2h1.027a4.5 4.5 0 0 1 7.788-2.543Z" /></g><text xml:space="preserve" x="340" y="984" font-size="22" fill="#161616" font-weight="700">Combien gagne-t-on ?</text><text xml:space="preserve" x="340" y="1035" font-size="44" fill="#161616" font-weight="700">1 690 €</text><text xml:space="preserve" x="340" y="1069" font-size="15" fill="#161616" font-weight="400">nets par mois · salaire médian</text><text xml:space="preserve" x="340" y="1102" font-size="14" fill="#666666" font-weight="400">Ouvriers non qualifiés du gros oeuvre du</text><text xml:space="preserve" x="340" y="1123" font-size="14" fill="#666666" font-weight="400">bâtiment</text><text xml:space="preserve" x="340" y="1154" font-size="13" fill="#666666" font-weight="400">Groupe de 8 métiers · temps complet</text><text xml:space="preserve" x="340" y="1179" font-size="13" fill="#666666" font-weight="400">Hérault · 2023 · INSEE, traitements RCO</text><text xml:space="preserve" x="340" y="1212" font-size="13" fill="#000091" font-weight="700">Lire les salaires et les secteurs</text><g transform="translate(788,1194) scale(1.0)" fill="#000091" aria-hidden="true"><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="m16.172 11-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2h12.172Z" /></g><rect x="854" y="884" width="510" height="350" rx="0" fill="white" stroke="#dddddd"/><rect x="874" y="904" width="44" height="44" rx="0" fill="#f4f6fe" stroke="#f4f6fe"/><g transform="translate(884,914) scale(1.0)" fill="#3558a2" aria-hidden="true"><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="M19 2a1 1 0 0 1 1 1v19.143a.5.5 0 0 1-.766.424L12 18.03l-7.234 4.536A.5.5 0 0 1 4 22.143V3a1 1 0 0 1 1-1h14Zm-1 2H6v15.432l6-3.761 6 3.761V4Z" /></g><text xml:space="preserve" x="874" y="984" font-size="22" fill="#161616" font-weight="700">Quelles autres pistes ?</text><text xml:space="preserve" x="874" y="1025" font-size="16" fill="#161616" font-weight="400">Des métiers signalés comme proches</text><text xml:space="preserve" x="874" y="1070" font-size="21" fill="#161616" font-weight="700">Travaux d’étanchéité et d’isolation</text><text xml:space="preserve" x="874" y="1154" font-size="14" fill="#666666" font-weight="400">Comparer les activités et les conditions</text><text xml:space="preserve" x="874" y="1179" font-size="13" fill="#666666" font-weight="400">France Travail · métiers proches</text><text xml:space="preserve" x="874" y="1212" font-size="13" fill="#000091" font-weight="700">Découvrir les métiers proches</text><g transform="translate(1322,1194) scale(1.0)" fill="#000091" aria-hidden="true"><ns0:path xmlns:ns0="http://www.w3.org/2000/svg" d="m16.172 11-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2h12.172Z" /></g><text xml:space="preserve" x="320" y="1293" font-size="24" fill="#161616" font-weight="700">Pour aller plus loin</text><text xml:space="preserve" x="320" y="1338" font-size="16" fill="#000091" font-weight="400">Les parcours professionnels observés</text><text xml:space="preserve" x="320" y="1375" font-size="16" fill="#000091" font-weight="400">Les changements possibles à 2030</text><text xml:space="preserve" x="320" y="1412" font-size="16" fill="#000091" font-weight="400">Les certifications et formations</text><text xml:space="preserve" x="320" y="1449" font-size="16" fill="#000091" font-weight="400">Les secteurs qui emploient</text><rect x="0" y="1518" width="1440" height="180" rx="0" fill="#f6f6f6" stroke="#dddddd"/><text xml:space="preserve" x="20" y="1548" font-size="15" fill="#161616" font-weight="700">Annotations de conception — hors écran citoyen</text><text xml:space="preserve" x="20" y="1576" font-size="14" fill="#666666" font-weight="400">Même navigation : US005/008/009/027/028. Les valeurs viennent de R16, pas du fichier HTML d’intention. Groupes et lieux restent distincts. Toutes</text><text xml:space="preserve" x="20" y="1597" font-size="14" fill="#666666" font-weight="400">les rubriques restent accessibles.</text></g></svg>