<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1200" viewBox="0 0 1280 1200" role="img" aria-labelledby="titre description"><title id="titre">02_COMPARATEUR_DESKTOP.svg</title><desc id="description">Comparateur existant à deux métiers ; identité des colonnes, mêmes contrôles, donnée absente explicitée sans emprunter les chiffres de l’autre métier.</desc><rect width="1280" height="1200" fill="white"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1280" height="80" rx="0" fill="white" stroke="#dddddd"/><text xml:space="preserve" x="48" y="47" font-size="25" fill="#161616" font-weight="700">MaCarrière</text><text xml:space="preserve" x="1020" y="45" font-size="16" fill="#000091" font-weight="700">Explorer</text><text xml:space="preserve" x="1140" y="45" font-size="16" fill="#000091" font-weight="700">Mes pistes</text><text xml:space="preserve" x="48" y="151" font-size="36" fill="#161616" font-weight="700">Deux métiers, pour y voir plus clair</text><text xml:space="preserve" x="48" y="194" font-size="18" fill="#666666" font-weight="400">Choisissez les métiers. Regardez ce qui compte pour vous, sans score global.</text><rect x="48" y="234" width="568" height="180" rx="0" fill="#f6f6f6" stroke="#dddddd"/><text xml:space="preserve" x="68" y="268" font-size="15" fill="#000091" font-weight="700">Métier A</text><text xml:space="preserve" x="68" y="305" font-size="24" fill="#161616" font-weight="700">Pose et restauration de</text><text xml:space="preserve" x="68" y="336" font-size="24" fill="#161616" font-weight="700">couvertures</text><text xml:space="preserve" x="68" y="385" font-size="15" fill="#000091" font-weight="400">Choisir un métier</text><rect x="664" y="234" width="568" height="180" rx="0" fill="#f6f6f6" stroke="#dddddd"/><text xml:space="preserve" x="684" y="268" font-size="15" fill="#000091" font-weight="700">Métier B</text><text xml:space="preserve" x="684" y="305" font-size="24" fill="#161616" font-weight="700">Travaux d’étanchéité et</text><text xml:space="preserve" x="684" y="336" font-size="24" fill="#161616" font-weight="700">d’isolation</text><text xml:space="preserve" x="684" y="385" font-size="15" fill="#000091" font-weight="400">Choisir un métier</text><text xml:space="preserve" x="48" y="455" font-size="16" fill="#000091" font-weight="400">Inverser les métiers</text><text xml:space="preserve" x="48" y="519" font-size="17" fill="#000091" font-weight="700">Le travail     Savoir-faire et conditions     Emploi et salaires     Les formations</text><text xml:space="preserve" x="48" y="590" font-size="27" fill="#161616" font-weight="700">Les mêmes repères, leurs limites en plus</text><rect x="48" y="624" width="568" height="300" rx="0" fill="white" stroke="#dddddd"/><rect x="664" y="624" width="568" height="300" rx="0" fill="white" stroke="#dddddd"/><text xml:space="preserve" x="72" y="678" font-size="34" fill="#161616" font-weight="700">1 690 € nets / mois</text><text xml:space="preserve" x="72" y="721" font-size="17" fill="#161616" font-weight="400">Ouvriers non qualifiés du gros oeuvre du</text><text xml:space="preserve" x="72" y="745" font-size="17" fill="#161616" font-weight="400">bâtiment</text><text xml:space="preserve" x="72" y="787" font-size="15" fill="#666666" font-weight="400">Groupe de 8 métiers · Hérault · 2023</text><text xml:space="preserve" x="72" y="822" font-size="15" fill="#666666" font-weight="400">INSEE · temps complet · médiane</text><text xml:space="preserve" x="688" y="678" font-size="27" fill="#161616" font-weight="700">Information non disponible</text><text xml:space="preserve" x="688" y="727" font-size="18" fill="#666666" font-weight="400">Les chiffres du métier A ne sont pas</text><text xml:space="preserve" x="688" y="752" font-size="18" fill="#666666" font-weight="400">utilisés pour remplir cette colonne.</text><text xml:space="preserve" x="72" y="887" font-size="16" fill="#000091" font-weight="400">Revoir la fiche du métier A</text><text xml:space="preserve" x="688" y="887" font-size="16" fill="#000091" font-weight="400">Revoir la fiche du métier B</text><text xml:space="preserve" x="48" y="979" font-size="18" fill="#161616" font-weight="400">Les tableaux, sources et détails restent disponibles dans chaque rubrique.</text><rect x="0" y="1040" width="1280" height="160" rx="0" fill="#f6f6f6" stroke="#dddddd"/><text xml:space="preserve" x="48" y="1080" font-size="18" fill="#161616" font-weight="700">Annotations — US028 / US012 / US032–035</text><text xml:space="preserve" x="48" y="1120" font-size="16" fill="#666666" font-weight="400">Identités A/B, inversion, retours, mêmes données et mêmes filtres. Aucune comparaison salariale complète n’est revendiquée en</text><text xml:space="preserve" x="48" y="1143" font-size="16" fill="#666666" font-weight="400">l’absence de réponse pour B.</text></g></svg>