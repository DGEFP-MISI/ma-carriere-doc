<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3680" viewBox="0 0 1440 3680" role="img" aria-label="Explorer V2 — choix des visualisations"><rect width="1440" height="3680" fill="white"/><g font-family="Marianne, Arial, sans-serif"><text x="48" y="65" font-size="36" font-weight="700">Explorer V2 — choix des visualisations</text><text x="48" y="105" font-size="17">29 mesures conservées. Champs, grains, périodes et paramètres dans MATRICE_VISUALISATIONS.csv.</text><rect x="48" y="160" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="192" font-size="20" font-weight="700" fill="#000091">Tension sur le marché du</text><text x="68" y="220" font-size="20" font-weight="700" fill="#000091">travail</text><text x="68" y="262" font-size="15" fill="#161616">Liste catégorielle par FAP + détail des sept</text><text x="68" y="284" font-size="15" fill="#161616">composantes. Pas de jauge numérique, radar ou</text><text x="68" y="306" font-size="15" fill="#161616">moyenne entre familles.</text>
<rect x="500" y="160" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="192" font-size="20" font-weight="700" fill="#000091">Demandeurs d'emploi</text><text x="520" y="234" font-size="15" fill="#161616">Carte d'effectif contextualisée. Pas de ratio</text><text x="520" y="256" font-size="15" fill="#161616">offres/demandeurs ni de probabilité</text><text x="520" y="278" font-size="15" fill="#161616">d'embauche.</text>
<rect x="952" y="160" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="972" y="192" font-size="20" font-weight="700" fill="#000091">Offres d'emploi diffusées</text><text x="972" y="234" font-size="15" fill="#161616">Carte d'effectif distincte des offres</text><text x="972" y="256" font-size="15" fill="#161616">collectées. Trois mois, partenaires diffusés</text><text x="972" y="278" font-size="15" fill="#161616">; aucune somme avec les collectées.</text>
<rect x="48" y="510" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="542" font-size="20" font-weight="700" fill="#000091">Offres d'emploi collectées</text><text x="68" y="584" font-size="15" fill="#161616">Carte d'effectif distincte des projets BMO.</text><text x="68" y="606" font-size="15" fill="#161616">Pas de déduction de postes vacants à partir</text><text x="68" y="628" font-size="15" fill="#161616">du stock.</text>
<rect x="500" y="510" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="542" font-size="20" font-weight="700" fill="#000091">Salaires nets annuels</text><text x="520" y="584" font-size="15" fill="#161616">Médiane mensuelle en carte ; Q1/médiane/Q3</text><text x="520" y="606" font-size="15" fill="#161616">annuels en tableau ; tranches en texte. Ne</text><text x="520" y="628" font-size="15" fill="#161616">pas diviser l'annuel par douze ; pas de boîte</text><text x="520" y="650" font-size="15" fill="#161616">à moustaches sans extrêmes.</text>
<rect x="952" y="510" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="972" y="542" font-size="20" font-weight="700" fill="#000091">Projets de recrutement (BMO)</text><text x="972" y="584" font-size="15" fill="#161616">Table projets, difficultés, saisonniers par</text><text x="972" y="606" font-size="15" fill="#161616">FAP228 ; classement territorial séparé. Taux</text><text x="972" y="628" font-size="15" fill="#161616">publiés non recalculés sur effectifs arrondis</text><text x="972" y="650" font-size="15" fill="#161616">; pas de cumul des FAP.</text>
<rect x="48" y="860" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="892" font-size="20" font-weight="700" fill="#000091">Les métiers en 2030</text><text x="68" y="920" font-size="20" font-weight="700" fill="#000091">(prospective)</text><text x="68" y="962" font-size="15" fill="#161616">Table de cinq composantes avec effectif et</text><text x="68" y="984" font-size="15" fill="#161616">taux ; repères</text><text x="68" y="1006" font-size="15" fill="#161616">emploi2019/part/spécificité/tension. Pas de</text><text x="68" y="1028" font-size="15" fill="#161616">cascade, courbe annuelle, recomposition</text><text x="68" y="1050" font-size="15" fill="#161616">arithmétique ou prévision individuelle.</text>
<rect x="500" y="860" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="892" font-size="20" font-weight="700" fill="#000091">Caractéristiques des offres</text><text x="520" y="920" font-size="20" font-weight="700" fill="#000091">d'emploi</text><text x="520" y="962" font-size="15" fill="#161616">Barres 0–100 par groupe de variables + base</text><text x="520" y="984" font-size="15" fill="#161616">d'offres ; tableau alternatif. Emploi durable</text><text x="520" y="1006" font-size="15" fill="#161616">et CDI se recouvrent ; pas de camembert</text><text x="520" y="1028" font-size="15" fill="#161616">réunissant toutes les dimensions.</text>
<rect x="952" y="860" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="972" y="892" font-size="20" font-weight="700" fill="#000091">Offres d'emploi par mois</text><text x="972" y="934" font-size="15" fill="#161616">Petits histogrammes mensuels : offres et</text><text x="972" y="956" font-size="15" fill="#161616">postes dans deux séries séparées. Douze</text><text x="972" y="978" font-size="15" fill="#161616">points réellement reçus ; pas de lissage,</text><text x="972" y="1000" font-size="15" fill="#161616">variation calculée ou mois absent égal zéro.</text>
<rect x="48" y="1210" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="1242" font-size="20" font-weight="700" fill="#000091">Compétences demandées dans les</text><text x="68" y="1270" font-size="20" font-weight="700" fill="#000091">offres d'emploi</text><text x="68" y="1312" font-size="15" fill="#161616">Classement de compétences citées dans les</text><text x="68" y="1334" font-size="15" fill="#161616">offres ; rang/taux/base reçus. Séparer du</text><text x="68" y="1356" font-size="15" fill="#161616">référentiel OGR ; pas de score de maîtrise ou</text><text x="68" y="1378" font-size="15" fill="#161616">taux de couverture du métier.</text>
<rect x="500" y="1210" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="1242" font-size="20" font-weight="700" fill="#000091">Secteurs d'activité qui</text><text x="520" y="1270" font-size="20" font-weight="700" fill="#000091">emploient le métier</text><text x="520" y="1312" font-size="15" fill="#161616">Barres horizontales et tableau effectif/part,</text><text x="520" y="1334" font-size="15" fill="#161616">une FAP225 à la fois. Sélection publiée non</text><text x="520" y="1356" font-size="15" fill="#161616">renormalisée ; pas d'attribution des actifs</text><text x="520" y="1378" font-size="15" fill="#161616">familiaux au seul métier.</text>
<rect x="952" y="1210" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="972" y="1242" font-size="20" font-weight="700" fill="#000091">Statut d'emploi : salarié ou</text><text x="972" y="1270" font-size="20" font-weight="700" fill="#000091">indépendant</text><text x="972" y="1312" font-size="15" fill="#161616">Table effectifs/taux salariés, indépendants,</text><text x="972" y="1334" font-size="15" fill="#161616">employeurs, aides familiaux. Vérifier</text><text x="972" y="1356" font-size="15" fill="#161616">exclusivité des catégories ; pas de donut</text><text x="972" y="1378" font-size="15" fill="#161616">supposant leur somme égale100.</text>
<rect x="48" y="1560" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="1592" font-size="20" font-weight="700" fill="#000091">Formations préparant au métier</text><text x="68" y="1620" font-size="20" font-weight="700" fill="#000091">sur le territoire</text><text x="68" y="1662" font-size="15" fill="#161616">Table par dispositif et année ; entrées,</text><text x="68" y="1684" font-size="15" fill="#161616">inscriptions, sessions et certifications</text><text x="68" y="1706" font-size="15" fill="#161616">séparées. Pas de total de populations, de</text><text x="68" y="1728" font-size="15" fill="#161616">rang d'attractivité ni de disponibilité de</text><text x="68" y="1750" font-size="15" fill="#161616">places.</text>
<rect x="500" y="1560" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="1592" font-size="20" font-weight="700" fill="#000091">Insertion des sortants des</text><text x="520" y="1620" font-size="20" font-weight="700" fill="#000091">formations au métier</text><text x="520" y="1648" font-size="20" font-weight="700" fill="#000091">(InserJeunes)</text><text x="520" y="1690" font-size="15" fill="#161616">Table par voie ; emploi12m et poursuite</text><text x="520" y="1712" font-size="15" fill="#161616">d'études avec dénominateurs propres. Ne pas</text><text x="520" y="1734" font-size="15" fill="#161616">fusionner promotions/populations, emploi et</text><text x="520" y="1756" font-size="15" fill="#161616">poursuite.</text>
<rect x="952" y="1560" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="972" y="1592" font-size="20" font-weight="700" fill="#000091">Dynamique des secteurs</text><text x="972" y="1620" font-size="20" font-weight="700" fill="#000091">d'activité</text><text x="972" y="1662" font-size="15" fill="#161616">Cartes employeurs/salariés ; tableau</text><text x="972" y="1684" font-size="15" fill="#161616">évolutions et dates des défaillances. R17 :</text><text x="972" y="1706" font-size="15" fill="#161616">contexte territorial sans ROME séparé du</text><text x="972" y="1728" font-size="15" fill="#161616">résultat avec ROME ; aucune jointure</text><text x="972" y="1750" font-size="15" fill="#161616">inventée.</text>
<rect x="48" y="1910" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="1942" font-size="20" font-weight="700" fill="#000091">Salaires nets annuels par</text><text x="68" y="1970" font-size="20" font-weight="700" fill="#000091">secteur d'activité</text><text x="68" y="2012" font-size="15" fill="#161616">Table FAP225 × NAF38 avec médiane mensuelle,</text><text x="68" y="2034" font-size="15" fill="#161616">part et détail annuel. Séparer régions et</text><text x="68" y="2056" font-size="15" fill="#161616">France ; pas de salaire moyen, écart calculé</text><text x="68" y="2078" font-size="15" fill="#161616">ou renormalisation des parts.</text>
<rect x="500" y="1910" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="1942" font-size="20" font-weight="700" fill="#000091">Origine des personnes qui</text><text x="520" y="1970" font-size="20" font-weight="700" fill="#000091">exercent un métier</text><text x="520" y="2012" font-size="15" fill="#161616">Barres horizontales0–100 + table ; sens</text><text x="520" y="2034" font-size="15" fill="#161616">origines, région, âge et FAP visibles. Top15</text><text x="520" y="2056" font-size="15" fill="#161616">et secret : ne pas compléter à100 ; âge en</text><text x="520" y="2078" font-size="15" fill="#161616">fin de période ; pas de lien FAP→ROME</text><text x="520" y="2100" font-size="15" fill="#161616">inventé.</text>
<rect x="952" y="1910" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="972" y="1942" font-size="20" font-weight="700" fill="#000091">Devenir des personnes qui</text><text x="972" y="1970" font-size="20" font-weight="700" fill="#000091">exercent un métier</text><text x="972" y="2012" font-size="15" fill="#161616">Barres horizontales0–100 + table ; sens</text><text x="972" y="2034" font-size="15" fill="#161616">destinations, région, âge et FAP visibles.</text><text x="972" y="2056" font-size="15" fill="#161616">Pas de Sankey sans matrice exhaustive ; âge</text><text x="972" y="2078" font-size="15" fill="#161616">en début de période ; même famille ≠ même</text><text x="972" y="2100" font-size="15" fill="#161616">poste.</text>
<rect x="48" y="2260" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="2292" font-size="20" font-weight="700" fill="#000091">Tension de la FAP principale</text><text x="68" y="2334" font-size="15" fill="#161616">Repère catégoriel national et explication du</text><text x="68" y="2356" font-size="15" fill="#161616">choix de FAP ; liste par FAP. Conserver</text><text x="68" y="2378" font-size="15" fill="#161616">méthode/indice reçus en détail ; aucune</text><text x="68" y="2400" font-size="15" fill="#161616">moyenne de tension.</text>
<rect x="500" y="2260" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="2292" font-size="20" font-weight="700" fill="#000091">Taux d'emploi à 12 mois et</text><text x="520" y="2320" font-size="20" font-weight="700" fill="#000091">poursuite d'études</text><text x="520" y="2348" font-size="20" font-weight="700" fill="#000091">(InserJeunes)</text><text x="520" y="2390" font-size="15" fill="#161616">Table par voie scolaire/apprentissage ;</text><text x="520" y="2412" font-size="15" fill="#161616">cartes distinctes emploi12m et poursuite.</text><text x="520" y="2434" font-size="15" fill="#161616">Dénominateur sortants ou année terminale ;</text><text x="520" y="2456" font-size="15" fill="#161616">conserver le cumul de promotions.</text>
<rect x="952" y="2260" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="972" y="2292" font-size="20" font-weight="700" fill="#000091">Taux d'emploi salarié à 12</text><text x="972" y="2320" font-size="20" font-weight="700" fill="#000091">mois et poursuite d'études</text><text x="972" y="2348" font-size="20" font-weight="700" fill="#000091">(InserSup)</text><text x="972" y="2390" font-size="15" fill="#161616">Table promotion, diplômés, emploi12m,</text><text x="972" y="2412" font-size="15" fill="#161616">poursuite. Base emploi et base poursuite</text><text x="972" y="2434" font-size="15" fill="#161616">distinctes ; pas de fusion avec InserJeunes.</text>
<rect x="48" y="2610" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="2642" font-size="20" font-weight="700" fill="#000091">Salaire des diplômés</text><text x="68" y="2670" font-size="20" font-weight="700" fill="#000091">(InserSup)</text><text x="68" y="2712" font-size="15" fill="#161616">Table Q1/médiane/Q3 par horizon12/18/30mois</text><text x="68" y="2734" font-size="15" fill="#161616">et population. Pas de courbe de carrière :</text><text x="68" y="2756" font-size="15" fill="#161616">horizons et diplômés peuvent différer ;</text><text x="68" y="2778" font-size="15" fill="#161616">respecter unité du contrat.</text>
<rect x="500" y="2610" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="2642" font-size="20" font-weight="700" fill="#000091">Accès à l'emploi à 6 mois et</text><text x="520" y="2670" font-size="20" font-weight="700" fill="#000091">abandons des demandeurs</text><text x="520" y="2698" font-size="20" font-weight="700" fill="#000091">d'emploi formés</text><text x="520" y="2740" font-size="15" fill="#161616">Cartes emploi6m et abandon + bases en</text><text x="520" y="2762" font-size="15" fill="#161616">tableau. Pas de comparaison directe avec</text><text x="520" y="2784" font-size="15" fill="#161616">emploi salarié12m.</text>
<rect x="952" y="2610" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="972" y="2642" font-size="20" font-weight="700" fill="#000091">Inscrits en formation</text><text x="972" y="2684" font-size="15" fill="#161616">Table dispositif / effectif / rentrée.</text><text x="972" y="2706" font-size="15" fill="#161616">Millésimes différents ; pas de total toutes</text><text x="972" y="2728" font-size="15" fill="#161616">voies.</text>
<rect x="48" y="2960" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="2992" font-size="20" font-weight="700" fill="#000091">Diplômés et réussite aux</text><text x="68" y="3020" font-size="20" font-weight="700" fill="#000091">examens</text><text x="68" y="3062" font-size="15" fill="#161616">Table population, présents, admis et</text><text x="68" y="3084" font-size="15" fill="#161616">réussite. Pas de taux recalculé ou de</text><text x="68" y="3106" font-size="15" fill="#161616">population mélangée.</text>
<rect x="500" y="2960" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="2992" font-size="20" font-weight="700" fill="#000091">Attractivité de la formation</text><text x="520" y="3034" font-size="15" fill="#161616">Table capacités et demandes</text><text x="520" y="3056" font-size="15" fill="#161616">Affelnet/Parcoursup ; indices reçus</text><text x="520" y="3078" font-size="15" fill="#161616">expliqués. Pas d'indice local inventé, de</text><text x="520" y="3100" font-size="15" fill="#161616">chance d'admission ou de disponibilité</text><text x="520" y="3122" font-size="15" fill="#161616">actuelle.</text>
<rect x="952" y="2960" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="972" y="2992" font-size="20" font-weight="700" fill="#000091">Voies d'accès, VAE et</text><text x="972" y="3020" font-size="20" font-weight="700" fill="#000091">validation partielle</text><text x="972" y="3062" font-size="15" fill="#161616">Liste Oui/Non/Non renseigné ; blocs en</text><text x="972" y="3084" font-size="15" fill="#161616">accordéons textuels. Booléen nullable ; voie</text><text x="972" y="3106" font-size="15" fill="#161616">possible ≠ éligibilité ; aucun alignement</text><text x="972" y="3128" font-size="15" fill="#161616">RNCP↔OGR automatique.</text>
<rect x="48" y="3310" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="3342" font-size="20" font-weight="700" fill="#000091">Formacodes de la certification</text><text x="68" y="3384" font-size="15" fill="#161616">Liens de thèmes identifiés vers</text><text x="68" y="3406" font-size="15" fill="#161616">certifications filtrées ; principal distinct.</text><text x="68" y="3428" font-size="15" fill="#161616">Ne pas réutiliser le code comme DomaineROME</text><text x="68" y="3450" font-size="15" fill="#161616">ou domaine de compétences.</text>
<rect x="500" y="3310" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="3342" font-size="20" font-weight="700" fill="#000091">Tags stratégiques</text><text x="520" y="3384" font-size="15" fill="#161616">Repères textuels avec état vrai/faux/null et</text><text x="520" y="3406" font-size="15" fill="#161616">thème reçu. Pas de filtre serveur de</text><text x="520" y="3428" font-size="15" fill="#161616">transition inventé, d'évaluation de potentiel</text><text x="520" y="3450" font-size="15" fill="#161616">ou d'exhaustivité locale.</text></g></svg>
