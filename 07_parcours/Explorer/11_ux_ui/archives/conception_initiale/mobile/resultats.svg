<text x="24" y="777" font-size="24" font-weight="700" fill="#161616">Métier à consulter</text>
<text x="24" y="813" font-size="16" font-weight="400" fill="#666">Le nom et le code permettent</text>
<text x="24" y="837" font-size="16" font-weight="400" fill="#666">d'éviter les ambiguïtés.</text>
<rect x="24" y="865" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="897" font-size="12" font-weight="700" fill="#666">Métier</text>
<text x="44" y="919" font-size="16" font-weight="700" fill="#161616">Pose et restauration de</text>
<text x="44" y="943" font-size="16" font-weight="700" fill="#161616">couvertures</text>
<text x="44" y="975" font-size="12" font-weight="700" fill="#666">Référentiel</text>
<text x="44" y="997" font-size="16" font-weight="400" fill="#161616">ROME V3 · F1610</text>
<text x="44" y="1029" font-size="12" font-weight="700" fill="#666">Domaine</text>
<text x="44" y="1051" font-size="16" font-weight="400" fill="#161616">Second oeuvre</text>
<rect x="24" y="1095" width="342" height="48" fill="#000091" stroke="#000091"/>
<a href="essentiel.svg" aria-label="Consulter la fiche F1610">
<text x="40" y="1123" font-size="16" font-weight="700" fill="#fff">Consulter la fiche F1610</text>
