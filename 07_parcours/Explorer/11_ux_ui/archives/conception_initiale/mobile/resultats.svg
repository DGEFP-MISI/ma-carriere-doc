<text x="40" y="1855" font-size="16" font-weight="700" fill="#000091">Explorer le domaine Second œuvre</text>
</a>
<rect x="24" y="1887" width="342" height="48" fill="#fff" stroke="#000091"/>
<a href="guide.svg" aria-label="Chercher avec des compétences">
<text x="40" y="1915" font-size="16" font-weight="700" fill="#000091">Chercher avec des compétences</text>
</a>
<rect x="24" y="1947" width="342" height="216" fill="#ececfe" stroke="none"/>
<text x="44" y="1983" font-size="16" font-weight="700" fill="#161616">Vous ne trouvez pas le bon</text>
<text x="44" y="2007" font-size="16" font-weight="700" fill="#161616">intitulé ?</text>
<text x="44" y="2039" font-size="16" font-weight="400" fill="#161616">Essayez une appellation ou</text>
<text x="44" y="2063" font-size="16" font-weight="400" fill="#161616">explorez un domaine. Aucun</text>
<text x="44" y="2087" font-size="16" font-weight="400" fill="#161616">résultat ne signifie pas que le</text>
<text x="44" y="2111" font-size="16" font-weight="400" fill="#161616">métier ou l'emploi n'existe</text>
<text x="44" y="2135" font-size="16" font-weight="400" fill="#161616">pas.</text>
<text x="24" y="2201" font-size="14" font-weight="400" fill="#666">Ouvrez une fiche identifiée pour vérifier</text>
<text x="24" y="2222" font-size="14" font-weight="400" fill="#666">qu'elle correspond à votre recherche.</text>
