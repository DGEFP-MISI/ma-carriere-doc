<text x="24" y="282" font-size="30" font-weight="700" fill="#161616">Choisissez un</text>
<text x="24" y="327" font-size="30" font-weight="700" fill="#161616">métier identifié</text>
<text x="24" y="370" font-size="16" font-weight="400" fill="#666">Exemple de consultation autour de «</text>
<text x="24" y="394" font-size="16" font-weight="400" fill="#666">couvreur » : ouvrez la fiche</text>
<text x="24" y="418" font-size="16" font-weight="400" fill="#666">correspondant à votre recherche.</text>
<text x="24" y="466" font-size="16" font-weight="700" fill="#161616">Métier ou appellation</text>
<text x="24" y="488" font-size="14" font-weight="400" fill="#666">La recherche s'appuie sur les intitulés,</text>
<text x="24" y="509" font-size="14" font-weight="400" fill="#666">appellations et définitions du</text>
<text x="24" y="530" font-size="14" font-weight="400" fill="#666">référentiel.</text>
<rect x="24" y="545" width="342" height="48" fill="#eee" stroke="none"/>
<text x="36" y="573" font-size="16" font-weight="400" fill="#161616">Couvreur</text>
