<text x="24" y="1255" font-size="24" font-weight="700" fill="#161616">Autres pistes du domaine</text>
<text x="24" y="1291" font-size="16" font-weight="400" fill="#666">Ces associations de domaine sont</text>
<text x="24" y="1315" font-size="16" font-weight="400" fill="#666">distinctes des résultats d'une</text>
<text x="24" y="1339" font-size="16" font-weight="400" fill="#666">recherche plein texte.</text>
<rect x="24" y="1367" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1399" font-size="12" font-weight="700" fill="#666">Métier</text>
<text x="44" y="1421" font-size="16" font-weight="700" fill="#161616">Travaux d'étanchéité et</text>
<text x="44" y="1445" font-size="16" font-weight="700" fill="#161616">d'isolation</text>
<text x="44" y="1477" font-size="12" font-weight="700" fill="#666">ROME V3</text>
<text x="44" y="1499" font-size="16" font-weight="400" fill="#161616">F1613</text>
<text x="44" y="1531" font-size="12" font-weight="700" fill="#666">Action</text>
<text x="44" y="1553" font-size="16" font-weight="400" fill="#161616">Consulter ou comparer</text>
<rect x="24" y="1597" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1629" font-size="12" font-weight="700" fill="#666">Métier</text>
<text x="44" y="1651" font-size="16" font-weight="700" fill="#161616">Montage de réseaux électriques</text>
<text x="44" y="1675" font-size="16" font-weight="700" fill="#161616">et télécoms</text>
<text x="44" y="1707" font-size="12" font-weight="700" fill="#666">ROME V3</text>
<text x="44" y="1729" font-size="16" font-weight="400" fill="#161616">F1605</text>
<text x="44" y="1761" font-size="12" font-weight="700" fill="#666">Action</text>
<text x="44" y="1783" font-size="16" font-weight="400" fill="#161616">Consulter ou comparer</text>
<rect x="24" y="1827" width="342" height="48" fill="#fff" stroke="#000091"/>
