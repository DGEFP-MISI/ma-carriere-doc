<text x="44" y="2027" font-size="12" font-weight="700" fill="#666">Élément</text>
<text x="44" y="2049" font-size="16" font-weight="700" fill="#161616">En grande hauteur</text>
<text x="44" y="2081" font-size="12" font-weight="700" fill="#666">F1610</text>
