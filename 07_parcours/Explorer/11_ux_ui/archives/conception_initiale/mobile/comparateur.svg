<text x="44" y="913" font-size="12" font-weight="700" fill="#666">Second métier</text>
<text x="44" y="935" font-size="16" font-weight="400" fill="#161616">F1613</text>
<rect x="24" y="979" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1011" font-size="12" font-weight="700" fill="#666">Repère</text>
<text x="44" y="1033" font-size="16" font-weight="700" fill="#161616">Domaine</text>
