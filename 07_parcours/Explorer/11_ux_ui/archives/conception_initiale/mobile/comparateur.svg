<text x="40" y="1299" font-size="16" font-weight="400" fill="#000091">○ Marché et territoires</text>
<rect x="24" y="1319" width="4" height="32" fill="#ddd" stroke="none"/>
<text x="40" y="1335" font-size="16" font-weight="400" fill="#000091">○ Se former</text>
<text x="24" y="1411" font-size="24" font-weight="700" fill="#161616">Compétences et</text>
<text x="24" y="1447" font-size="24" font-weight="700" fill="#161616">conditions</text>
<text x="24" y="1483" font-size="16" font-weight="400" fill="#666">Les deux listes doivent être</text>
<text x="24" y="1507" font-size="16" font-weight="400" fill="#666">complètes avant de conclure qu'une</text>
<text x="24" y="1531" font-size="16" font-weight="400" fill="#666">compétence est commune ou</text>
<text x="24" y="1555" font-size="16" font-weight="400" fill="#666">spécifique.</text>
