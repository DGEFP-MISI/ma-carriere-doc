<text x="44" y="705" font-size="16" font-weight="400" fill="#161616">Travaux d'étanchéité et</text>
<text x="44" y="729" font-size="16" font-weight="400" fill="#161616">d'isolation</text>
<rect x="24" y="773" width="342" height="190" fill="#f6f6f6" stroke="none"/>
