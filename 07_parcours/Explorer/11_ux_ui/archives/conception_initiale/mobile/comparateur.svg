<text x="44" y="1141" font-size="16" font-weight="400" fill="#161616">Second œuvre</text>
<text x="24" y="1197" font-size="12" font-weight="700" fill="#666">Vues disponibles</text>
<rect x="24" y="1211" width="4" height="32" fill="#000091" stroke="none"/>
<text x="40" y="1227" font-size="16" font-weight="700" fill="#000091">● Comprendre les métiers</text>
