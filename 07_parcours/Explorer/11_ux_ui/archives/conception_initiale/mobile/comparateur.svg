<rect x="24" y="2225" width="342" height="216" fill="#ececfe" stroke="none"/>
<text x="44" y="2261" font-size="16" font-weight="700" fill="#161616">Comparer les métiers, pas</text>
<text x="44" y="2285" font-size="16" font-weight="700" fill="#161616">présumer vos acquis</text>
<text x="44" y="2317" font-size="16" font-weight="400" fill="#161616">Le rapprochement directionnel</text>
<text x="44" y="2341" font-size="16" font-weight="400" fill="#161616">prévu par l'API reste une</text>
<text x="44" y="2365" font-size="16" font-weight="400" fill="#161616">relation entre référentiels.</text>
<text x="44" y="2389" font-size="16" font-weight="400" fill="#161616">Son résultat n'est pas rempli</text>
<text x="44" y="2413" font-size="16" font-weight="400" fill="#161616">avec des chiffres d'exemple.</text>
<text x="24" y="2505" font-size="24" font-weight="700" fill="#161616">Marché et territoires</text>
<text x="24" y="2541" font-size="16" font-weight="400" fill="#666">Chaque colonne conserve famille,</text>
<text x="24" y="2565" font-size="16" font-weight="400" fill="#666">territoire réel, source et période.</text>
<rect x="24" y="2593" width="342" height="214" fill="#f6f6f6" stroke="none"/>
