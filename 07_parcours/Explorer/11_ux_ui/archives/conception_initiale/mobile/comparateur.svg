<text x="44" y="3185" font-size="16" font-weight="400" fill="#161616">Tension extrême</text>
<text x="44" y="3217" font-size="12" font-weight="700" fill="#666">F1613</text>
<text x="44" y="3239" font-size="16" font-weight="400" fill="#161616">Données non chargées</text>
<text x="24" y="3297" font-size="14" font-weight="400" fill="#666">Si deux métiers partagent la même FAP,</text>
<text x="24" y="3318" font-size="14" font-weight="400" fill="#666">une seule observation familiale est</text>
<text x="24" y="3339" font-size="14" font-weight="400" fill="#666">signalée comme partagée. L'absence de</text>
<text x="24" y="3360" font-size="14" font-weight="400" fill="#666">chargement ne vaut ni zéro ni absence de</text>
<text x="24" y="3381" font-size="14" font-weight="400" fill="#666">compétence.</text>
