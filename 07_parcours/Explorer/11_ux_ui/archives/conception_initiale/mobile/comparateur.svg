<text x="24" y="282" font-size="30" font-weight="700" fill="#161616">Comparer deux</text>
<text x="24" y="327" font-size="30" font-weight="700" fill="#161616">métiers, point par</text>
<text x="24" y="372" font-size="30" font-weight="700" fill="#161616">point</text>
<text x="24" y="415" font-size="16" font-weight="400" fill="#666">Descriptions, compétences,</text>
<text x="24" y="439" font-size="16" font-weight="400" fill="#666">certifications et données du marché,</text>
<text x="24" y="463" font-size="16" font-weight="400" fill="#666">sans note globale ni classement</text>
<text x="24" y="487" font-size="16" font-weight="400" fill="#666">personnel.</text>
<rect x="24" y="519" width="342" height="238" fill="#f6f6f6" stroke="none"/>
