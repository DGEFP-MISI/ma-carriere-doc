<text x="40" y="1637" font-size="16" font-weight="700" fill="#000091">+ Comprendre l'ordre :</text>
<text x="40" y="1661" font-size="16" font-weight="700" fill="#000091">macro-compétences puis</text>
<text x="40" y="1685" font-size="16" font-weight="700" fill="#000091">compétences trouvées</text>
<text x="24" y="1739" font-size="14" font-weight="400" fill="#666">R23 : trois métiers en mode au moins une</text>
<text x="24" y="1760" font-size="14" font-weight="400" fill="#666">; F1610 seul sur le même jeu en mode</text>
<text x="24" y="1781" font-size="14" font-weight="400" fill="#666">toutes. Ces nombres sont des résultats</text>
<text x="24" y="1802" font-size="14" font-weight="400" fill="#666">d'échantillon, pas une promesse de volume</text>
<text x="24" y="1823" font-size="14" font-weight="400" fill="#666">futur.</text>
