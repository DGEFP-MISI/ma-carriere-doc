<rect x="24" y="1161" width="342" height="240" fill="#ececfe" stroke="none"/>
<text x="44" y="1197" font-size="16" font-weight="700" fill="#161616">Un rattachement référentiel</text>
<text x="44" y="1221" font-size="16" font-weight="700" fill="#161616">n'est pas une recommandation</text>
<text x="44" y="1245" font-size="16" font-weight="700" fill="#161616">personnelle</text>
<text x="44" y="1277" font-size="16" font-weight="400" fill="#161616">Les correspondances reçues sont</text>
<text x="44" y="1301" font-size="16" font-weight="400" fill="#161616">montrées sans correction</text>
<text x="44" y="1325" font-size="16" font-weight="400" fill="#161616">sémantique inventée, sans score</text>
<text x="44" y="1349" font-size="16" font-weight="400" fill="#161616">et sans conclusion sur votre</text>
<text x="44" y="1373" font-size="16" font-weight="400" fill="#161616">aptitude.</text>
