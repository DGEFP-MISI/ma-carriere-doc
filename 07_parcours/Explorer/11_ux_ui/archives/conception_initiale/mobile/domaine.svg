<text x="44" y="1134" font-size="16" font-weight="400" fill="#161616">F1613</text>
<text x="44" y="1166" font-size="12" font-weight="700" fill="#666">Piste</text>
<text x="44" y="1188" font-size="16" font-weight="400" fill="#161616">Étanchéité et isolation</text>
<rect x="24" y="1232" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1264" font-size="12" font-weight="700" fill="#666">Métier</text>
<text x="44" y="1286" font-size="16" font-weight="700" fill="#161616">Montage de réseaux électriques</text>
<text x="44" y="1310" font-size="16" font-weight="700" fill="#161616">et télécoms</text>
