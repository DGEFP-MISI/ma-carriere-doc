<text x="24" y="282" font-size="30" font-weight="700" fill="#161616">Explorer le Second</text>
<text x="24" y="327" font-size="30" font-weight="700" fill="#161616">œuvre</text>
<text x="24" y="370" font-size="16" font-weight="400" fill="#666">Domaine professionnel ROME F16 ·</text>
<text x="24" y="394" font-size="16" font-weight="400" fill="#666">Construction, bâtiment et travaux</text>
<text x="24" y="418" font-size="16" font-weight="400" fill="#666">publics. À distinguer d'un secteur</text>
<text x="24" y="442" font-size="16" font-weight="400" fill="#666">économique NAF.</text>
<text x="24" y="490" font-size="16" font-weight="700" fill="#161616">Rechercher dans les domaines chargés</text>
<text x="24" y="512" font-size="14" font-weight="400" fill="#666">Filtre local des libellés de l'arbre ;</text>
<text x="24" y="533" font-size="14" font-weight="400" fill="#666">pas de recherche q sur /domaines.</text>
