<text x="24" y="1646" font-size="24" font-weight="700" fill="#161616">Affiner sans connaître</text>
<text x="24" y="1682" font-size="24" font-weight="700" fill="#161616">le nom d'un métier</text>
<text x="24" y="1718" font-size="16" font-weight="400" fill="#666">Compétences référencées, contextes à</text>
<text x="24" y="1742" font-size="16" font-weight="400" fill="#666">rechercher ou éviter, transitions</text>
