<text x="44" y="1950" font-size="16" font-weight="700" fill="#161616">Les statistiques sont</text>
<text x="44" y="1974" font-size="16" font-weight="700" fill="#161616">consultées au niveau des</text>
<text x="44" y="1998" font-size="16" font-weight="700" fill="#161616">métiers et familles</text>
<text x="44" y="2030" font-size="16" font-weight="400" fill="#161616">Aucun salaire moyen, total de</text>
<text x="44" y="2054" font-size="16" font-weight="400" fill="#161616">projets ou score n'est fabriqué</text>
<text x="44" y="2078" font-size="16" font-weight="400" fill="#161616">pour le domaine.</text>
<text x="24" y="2144" font-size="14" font-weight="400" fill="#666">Référentiel ROME : métiers et domaines</text>
<text x="24" y="2165" font-size="14" font-weight="400" fill="#666">professionnels. Les statistiques se</text>
<text x="24" y="2186" font-size="14" font-weight="400" fill="#666">consultent pour chaque métier et ses</text>
<text x="24" y="2207" font-size="14" font-weight="400" fill="#666">familles.</text>
