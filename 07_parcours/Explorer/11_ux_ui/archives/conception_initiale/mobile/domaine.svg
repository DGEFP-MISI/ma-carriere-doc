<text x="44" y="882" font-size="12" font-weight="700" fill="#666">ROME V3</text>
<text x="44" y="904" font-size="16" font-weight="400" fill="#161616">F1610</text>
<text x="44" y="936" font-size="12" font-weight="700" fill="#666">Piste</text>
<text x="44" y="958" font-size="16" font-weight="400" fill="#161616">Couverture</text>
<rect x="24" y="1002" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1034" font-size="12" font-weight="700" fill="#666">Métier</text>
<text x="44" y="1056" font-size="16" font-weight="700" fill="#161616">Travaux d'étanchéité et</text>
<text x="44" y="1080" font-size="16" font-weight="700" fill="#161616">d'isolation</text>
