<text x="24" y="696" font-size="16" font-weight="400" fill="#666">Sélectionnez un métier, puis</text>
<text x="24" y="720" font-size="16" font-weight="400" fill="#666">explorez ses compétences, données et</text>
<text x="24" y="744" font-size="16" font-weight="400" fill="#666">certifications.</text>
