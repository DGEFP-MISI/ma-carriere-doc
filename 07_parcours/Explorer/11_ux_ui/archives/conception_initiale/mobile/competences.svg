</a>
<text x="24" y="2005" font-size="14" font-weight="400" fill="#666">100 compétences reçues sur 144 annoncées</text>
<text x="24" y="2026" font-size="14" font-weight="400" fill="#666">: liste incomplète dans le jeu de</text>
<text x="24" y="2047" font-size="14" font-weight="400" fill="#666">référence.</text>
<rect x="24" y="2078" width="342" height="80" fill="#f6f6f6" stroke="none"/>
<text x="40" y="2110" font-size="16" font-weight="700" fill="#000091">+ Voir la suite et les</text>
<text x="40" y="2134" font-size="16" font-weight="700" fill="#000091">catégories complètes</text>
<text x="24" y="2214" font-size="24" font-weight="700" fill="#161616">Dans quelles conditions</text>
<text x="24" y="2250" font-size="24" font-weight="700" fill="#161616">?</text>
<text x="24" y="2286" font-size="16" font-weight="400" fill="#666">Un contexte est référencé pour au</text>
<text x="24" y="2310" font-size="16" font-weight="400" fill="#666">moins une spécialité ; il ne décrit</text>
<text x="24" y="2334" font-size="16" font-weight="400" fill="#666">pas tous les emplois.</text>
<rect x="24" y="2362" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2394" font-size="12" font-weight="700" fill="#666">Contexte référencé</text>
<text x="44" y="2416" font-size="16" font-weight="700" fill="#161616">En grande hauteur</text>
<text x="44" y="2448" font-size="12" font-weight="700" fill="#666">Choix proposé</text>
<text x="44" y="2470" font-size="16" font-weight="400" fill="#161616">Rechercher / éviter</text>
<text x="44" y="2502" font-size="12" font-weight="700" fill="#666">Action</text>
<text x="44" y="2524" font-size="16" font-weight="400" fill="#161616">Filtrer les pistes</text>
<rect x="24" y="2568" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2600" font-size="12" font-weight="700" fill="#666">Contexte référencé</text>
<text x="44" y="2622" font-size="16" font-weight="700" fill="#161616">En extérieur</text>
<text x="44" y="2654" font-size="12" font-weight="700" fill="#666">Choix proposé</text>
<text x="44" y="2676" font-size="16" font-weight="400" fill="#161616">Rechercher / éviter</text>
<text x="44" y="2708" font-size="12" font-weight="700" fill="#666">Action</text>
<text x="44" y="2730" font-size="16" font-weight="400" fill="#161616">Filtrer les pistes</text>
<rect x="24" y="2774" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2806" font-size="12" font-weight="700" fill="#666">Contexte référencé</text>
<text x="44" y="2828" font-size="16" font-weight="700" fill="#161616">Port de charges lourdes ou</text>
<text x="44" y="2852" font-size="16" font-weight="700" fill="#161616">encombrantes</text>
<text x="44" y="2884" font-size="12" font-weight="700" fill="#666">Choix proposé</text>
<text x="44" y="2906" font-size="16" font-weight="400" fill="#161616">Rechercher / éviter</text>
<text x="44" y="2938" font-size="12" font-weight="700" fill="#666">Action</text>
<text x="44" y="2960" font-size="16" font-weight="400" fill="#161616">Filtrer les pistes</text>
<rect x="24" y="3004" width="342" height="216" fill="#ececfe" stroke="none"/>
<text x="44" y="3040" font-size="16" font-weight="700" fill="#161616">Un contexte non référencé n'est</text>
<text x="44" y="3064" font-size="16" font-weight="700" fill="#161616">pas une garantie</text>
<text x="44" y="3096" font-size="16" font-weight="400" fill="#161616">« Sans ce contexte » exclut les</text>
<text x="44" y="3120" font-size="16" font-weight="400" fill="#161616">métiers qui le portent dans le</text>
<text x="44" y="3144" font-size="16" font-weight="400" fill="#161616">référentiel. Vérifiez ensuite</text>
<text x="44" y="3168" font-size="16" font-weight="400" fill="#161616">les conditions de l'emploi</text>
<text x="44" y="3192" font-size="16" font-weight="400" fill="#161616">envisagé.</text>
<rect x="24" y="3244" width="342" height="80" fill="#f6f6f6" stroke="none"/>
<text x="40" y="3276" font-size="16" font-weight="700" fill="#000091">+ Savoir-être : esprit d'équipe,</text>
<text x="40" y="3300" font-size="16" font-weight="700" fill="#000091">rigueur et précision, autonomie</text>
<text x="24" y="3354" font-size="14" font-weight="400" fill="#666">France Travail · codes OGR rattachés aux</text>
<text x="24" y="3375" font-size="14" font-weight="400" fill="#666">métiers ROME V3 ; pagination et</text>
<text x="24" y="3396" font-size="14" font-weight="400" fill="#666">catégories conservées.</text>
