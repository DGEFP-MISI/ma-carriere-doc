<text x="40" y="765" font-size="16" font-weight="400" fill="#000091">○ Conditions de travail</text>
<rect x="24" y="785" width="4" height="32" fill="#ddd" stroke="none"/>
<text x="40" y="801" font-size="16" font-weight="400" fill="#000091">○ Savoir-être</text>
<rect x="24" y="837" width="342" height="192" fill="#ececfe" stroke="none"/>
<text x="44" y="873" font-size="16" font-weight="700" fill="#161616">Le métier regroupe plusieurs</text>
<text x="44" y="897" font-size="16" font-weight="700" fill="#161616">spécialités</text>
<text x="44" y="929" font-size="16" font-weight="400" fill="#161616">La part des spécialités indique</text>
<text x="44" y="953" font-size="16" font-weight="400" fill="#161616">où une compétence est portée</text>
<text x="44" y="977" font-size="16" font-weight="400" fill="#161616">dans le métier. Elle ne mesure</text>
<text x="44" y="1001" font-size="16" font-weight="400" fill="#161616">pas votre niveau.</text>
<text x="24" y="1093" font-size="24" font-weight="700" fill="#161616">Compétences référencées</text>
<text x="24" y="1129" font-size="16" font-weight="400" fill="#666">Choisissez des codes OGR pour</text>
<text x="24" y="1153" font-size="16" font-weight="400" fill="#666">découvrir d'autres métiers qui les</text>
<text x="24" y="1177" font-size="16" font-weight="400" fill="#666">portent.</text>
<rect x="24" y="1205" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1237" font-size="12" font-weight="700" fill="#666">Compétence</text>
<text x="44" y="1259" font-size="16" font-weight="700" fill="#161616">Poser des panneaux solaires</text>
<text x="44" y="1291" font-size="12" font-weight="700" fill="#666">Spécialités</text>
<text x="44" y="1313" font-size="16" font-weight="400" fill="#161616">100 %</text>
<text x="44" y="1345" font-size="12" font-weight="700" fill="#666">Repère</text>
<text x="44" y="1367" font-size="16" font-weight="400" fill="#161616">Cœur : non renseigné</text>
<rect x="24" y="1411" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1443" font-size="12" font-weight="700" fill="#666">Compétence</text>
<text x="44" y="1465" font-size="16" font-weight="700" fill="#161616">Réaliser un raccordement</text>
<text x="44" y="1489" font-size="16" font-weight="700" fill="#161616">d'étanchéité</text>
<text x="44" y="1521" font-size="12" font-weight="700" fill="#666">Spécialités</text>
<text x="44" y="1543" font-size="16" font-weight="400" fill="#161616">100 %</text>
<text x="44" y="1575" font-size="12" font-weight="700" fill="#666">Repère</text>
<text x="44" y="1597" font-size="16" font-weight="400" fill="#161616">Cœur de métier</text>
<rect x="24" y="1641" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1673" font-size="12" font-weight="700" fill="#666">Compétence</text>
<text x="44" y="1695" font-size="16" font-weight="700" fill="#161616">Transmettre une technique, un</text>
<text x="44" y="1719" font-size="16" font-weight="700" fill="#161616">savoir-faire</text>
<text x="44" y="1751" font-size="12" font-weight="700" fill="#666">Spécialités</text>
<text x="44" y="1773" font-size="16" font-weight="400" fill="#161616">100 %</text>
<text x="44" y="1805" font-size="12" font-weight="700" fill="#666">Repère</text>
<text x="44" y="1827" font-size="16" font-weight="400" fill="#161616">Cœur : non renseigné</text>
<rect x="24" y="1871" width="342" height="48" fill="#000091" stroke="#000091"/>
