<text x="24" y="1710" font-size="24" font-weight="700" fill="#161616">Quelles sessions sont</text>
<text x="24" y="1746" font-size="24" font-weight="700" fill="#161616">publiées ?</text>
<text x="24" y="1782" font-size="16" font-weight="400" fill="#666">Depuis la certification, choisir une</text>
<text x="24" y="1806" font-size="16" font-weight="400" fill="#666">région, un département ou un bassin</text>
<text x="24" y="1830" font-size="16" font-weight="400" fill="#666">; à venir et en cours.</text>
<rect x="24" y="1858" width="342" height="48" fill="#fff" stroke="#000091"/>
<a href="certification.svg" aria-label="Consulter les sessions">
<text x="40" y="1886" font-size="16" font-weight="700" fill="#000091">Consulter les sessions</text>
</a>
