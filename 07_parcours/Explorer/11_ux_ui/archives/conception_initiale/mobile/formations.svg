<a href="formacodes.svg" aria-label="Thèmes de formation">
<text x="40" y="1946" font-size="16" font-weight="700" fill="#000091">Thèmes de formation</text>
</a>
<text x="24" y="2018" font-size="24" font-weight="700" fill="#161616">Quelles autres pistes</text>
<text x="24" y="2054" font-size="24" font-weight="700" fill="#161616">explorer ?</text>
<text x="24" y="2090" font-size="16" font-weight="400" fill="#666">Métiers proches dans l'ordre reçu :</text>
<text x="24" y="2114" font-size="16" font-weight="400" fill="#666">pas des flux de mobilité observés.</text>
<rect x="24" y="2142" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2174" font-size="12" font-weight="700" fill="#666">Métier proche</text>
<text x="44" y="2196" font-size="16" font-weight="700" fill="#161616">Montage de réseaux électriques</text>
<text x="44" y="2220" font-size="16" font-weight="700" fill="#161616">et télécoms</text>
<text x="44" y="2252" font-size="12" font-weight="700" fill="#666">ROME V3</text>
<text x="44" y="2274" font-size="16" font-weight="400" fill="#161616">F1605</text>
<text x="44" y="2306" font-size="12" font-weight="700" fill="#666">Action</text>
<text x="44" y="2328" font-size="16" font-weight="400" fill="#161616">Ouvrir ou comparer</text>
<rect x="24" y="2372" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2404" font-size="12" font-weight="700" fill="#666">Métier proche</text>
<text x="44" y="2426" font-size="16" font-weight="700" fill="#161616">Travaux d'étanchéité et</text>
<text x="44" y="2450" font-size="16" font-weight="700" fill="#161616">d'isolation</text>
<text x="44" y="2482" font-size="12" font-weight="700" fill="#666">ROME V3</text>
<text x="44" y="2504" font-size="16" font-weight="400" fill="#161616">F1613</text>
<text x="44" y="2536" font-size="12" font-weight="700" fill="#666">Action</text>
<text x="44" y="2558" font-size="16" font-weight="400" fill="#161616">Ouvrir ou comparer</text>
<rect x="24" y="2602" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2634" font-size="12" font-weight="700" fill="#666">Métier proche</text>
<text x="44" y="2656" font-size="16" font-weight="700" fill="#161616">Ingénierie et études du BTP</text>
<text x="44" y="2688" font-size="12" font-weight="700" fill="#666">ROME V3</text>
<text x="44" y="2710" font-size="16" font-weight="400" fill="#161616">F1106</text>
<text x="44" y="2742" font-size="12" font-weight="700" fill="#666">Action</text>
<text x="44" y="2764" font-size="16" font-weight="400" fill="#161616">Ouvrir ou comparer</text>
