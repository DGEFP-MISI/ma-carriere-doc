<rect x="24" y="2928" width="342" height="80" fill="#f6f6f6" stroke="none"/>
<text x="40" y="2960" font-size="16" font-weight="700" fill="#000091">+ Thèmes associés : couverture,</text>
<text x="40" y="2984" font-size="16" font-weight="700" fill="#000091">zinguerie, énergie solaire</text>
<text x="24" y="3038" font-size="14" font-weight="400" fill="#666">Certif Info / France compétences et</text>
<text x="24" y="3059" font-size="14" font-weight="400" fill="#666">référentiel métier. Les sessions publiées</text>
<text x="24" y="3080" font-size="14" font-weight="400" fill="#666">ne prouvent ni places disponibles ni</text>
<text x="24" y="3101" font-size="14" font-weight="400" fill="#666">possibilité d'inscription.</text>
