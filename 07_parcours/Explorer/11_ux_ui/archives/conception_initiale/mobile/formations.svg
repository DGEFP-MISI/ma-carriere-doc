<text x="24" y="282" font-size="30" font-weight="700" fill="#161616">Se former, se</text>
<text x="24" y="327" font-size="30" font-weight="700" fill="#161616">certifier et</text>
<text x="24" y="372" font-size="30" font-weight="700" fill="#161616">découvrir d'autres</text>
<text x="24" y="417" font-size="30" font-weight="700" fill="#161616">pistes</text>
<text x="24" y="460" font-size="16" font-weight="400" fill="#666">Des associations de référentiels</text>
<text x="24" y="484" font-size="16" font-weight="400" fill="#666">pour orienter l'exploration, sans</text>
<text x="24" y="508" font-size="16" font-weight="400" fill="#666">garantie d'admission ni d'emploi.</text>
<rect x="24" y="540" width="342" height="48" fill="#000091" stroke="#000091"/>
