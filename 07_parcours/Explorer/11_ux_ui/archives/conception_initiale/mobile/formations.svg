<text x="24" y="772" font-size="24" font-weight="700" fill="#161616">Quelles certifications</text>
<text x="24" y="808" font-size="24" font-weight="700" fill="#161616">sont associées ?</text>
<text x="24" y="844" font-size="16" font-weight="400" fill="#666">Certifications actives avec leur</text>
<text x="24" y="868" font-size="16" font-weight="400" fill="#666">type réel et un accès à leur fiche.</text>
<rect x="24" y="896" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="928" font-size="12" font-weight="700" fill="#666">Certification</text>
<text x="44" y="950" font-size="16" font-weight="700" fill="#161616">Titre professionnel</text>
<text x="44" y="974" font-size="16" font-weight="700" fill="#161616">couvreur-zingueur</text>
<text x="44" y="1006" font-size="12" font-weight="700" fill="#666">Référence</text>
<text x="44" y="1028" font-size="16" font-weight="400" fill="#161616">RNCP36101</text>
<text x="44" y="1060" font-size="12" font-weight="700" fill="#666">Consulter</text>
<text x="44" y="1082" font-size="16" font-weight="400" fill="#161616">Fiche certification</text>
<rect x="24" y="1126" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1158" font-size="12" font-weight="700" fill="#666">Certification</text>
<text x="44" y="1180" font-size="16" font-weight="700" fill="#161616">DSP installateur de systèmes de</text>
<text x="44" y="1204" font-size="16" font-weight="700" fill="#161616">production photovoltaïque</text>
<text x="44" y="1236" font-size="12" font-weight="700" fill="#666">Référence</text>
<text x="44" y="1258" font-size="16" font-weight="400" fill="#161616">RNCP37218</text>
<text x="44" y="1290" font-size="12" font-weight="700" fill="#666">Consulter</text>
<text x="44" y="1312" font-size="16" font-weight="400" fill="#161616">Fiche certification</text>
<rect x="24" y="1356" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1388" font-size="12" font-weight="700" fill="#666">Certification</text>
<text x="44" y="1410" font-size="16" font-weight="700" fill="#161616">Ouvrier professionnel en</text>
<text x="44" y="1434" font-size="16" font-weight="700" fill="#161616">restauration du patrimoine</text>
<text x="44" y="1466" font-size="12" font-weight="700" fill="#666">Référence</text>
<text x="44" y="1488" font-size="16" font-weight="400" fill="#161616">RNCP37516</text>
<text x="44" y="1520" font-size="12" font-weight="700" fill="#666">Consulter</text>
<text x="44" y="1542" font-size="16" font-weight="400" fill="#161616">Fiche certification</text>
<rect x="24" y="1586" width="342" height="72" fill="#000091" stroke="#000091"/>
