<text x="44" y="1844" font-size="16" font-weight="400" fill="#161616">55,1 %</text>
<rect x="24" y="1888" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1920" font-size="12" font-weight="700" fill="#666">Région</text>
<text x="44" y="1942" font-size="16" font-weight="700" fill="#161616">4. BRETAGNE</text>
<text x="44" y="1974" font-size="12" font-weight="700" fill="#666">Projets</text>
