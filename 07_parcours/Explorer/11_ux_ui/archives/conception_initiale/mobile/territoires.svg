<text x="44" y="2050" font-size="16" font-weight="400" fill="#161616">89,8 %</text>
<text x="24" y="2108" font-size="14" font-weight="400" fill="#666">Extrait du classement reçu. Les rangs</text>
<text x="24" y="2129" font-size="14" font-weight="400" fill="#666">sont propres à la famille ; B6X73 a son</text>
<text x="24" y="2150" font-size="14" font-weight="400" fill="#666">propre classement.</text>
<text x="24" y="2221" font-size="24" font-weight="700" fill="#161616">Salaires de la famille :</text>
<text x="24" y="2257" font-size="24" font-weight="700" fill="#161616">autre lecture</text>
<text x="24" y="2293" font-size="16" font-weight="400" fill="#666">B0Z21 · INSEE 2023 · lecture</text>
<text x="24" y="2317" font-size="16" font-weight="400" fill="#666">indépendante de BMO.</text>
<rect x="24" y="2345" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2377" font-size="12" font-weight="700" fill="#666">Région</text>
<text x="44" y="2399" font-size="16" font-weight="700" fill="#161616">BRETAGNE</text>
<text x="44" y="2431" font-size="12" font-weight="700" fill="#666">Médiane mensuelle</text>
<text x="44" y="2453" font-size="16" font-weight="400" fill="#161616">1 900 €</text>
<text x="44" y="2485" font-size="12" font-weight="700" fill="#666">Périmètre</text>
<text x="44" y="2507" font-size="16" font-weight="400" fill="#161616">8 métiers · B0Z21</text>
<rect x="24" y="2551" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2583" font-size="12" font-weight="700" fill="#666">Région</text>
<text x="44" y="2605" font-size="16" font-weight="700" fill="#161616">BOURGOGNE-FRANCHE-COMTE</text>
<text x="44" y="2637" font-size="12" font-weight="700" fill="#666">Médiane mensuelle</text>
<text x="44" y="2659" font-size="16" font-weight="400" fill="#161616">1 860 €</text>
<text x="44" y="2691" font-size="12" font-weight="700" fill="#666">Périmètre</text>
<text x="44" y="2713" font-size="16" font-weight="400" fill="#161616">8 métiers · B0Z21</text>
<rect x="24" y="2757" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2789" font-size="12" font-weight="700" fill="#666">Région</text>
<text x="44" y="2811" font-size="16" font-weight="700" fill="#161616">NORMANDIE</text>
<text x="44" y="2843" font-size="12" font-weight="700" fill="#666">Médiane mensuelle</text>
<text x="44" y="2865" font-size="16" font-weight="400" fill="#161616">1 820 €</text>
<text x="44" y="2897" font-size="12" font-weight="700" fill="#666">Périmètre</text>
<text x="44" y="2919" font-size="16" font-weight="400" fill="#161616">8 métiers · B0Z21</text>
<rect x="24" y="2963" width="342" height="216" fill="#ececfe" stroke="none"/>
<text x="44" y="2999" font-size="16" font-weight="700" fill="#161616">Aucun « meilleur territoire »</text>
<text x="44" y="3023" font-size="16" font-weight="700" fill="#161616">calculé</text>
<text x="44" y="3055" font-size="16" font-weight="400" fill="#161616">Les projets, les salaires et</text>
<text x="44" y="3079" font-size="16" font-weight="400" fill="#161616">vos contraintes sont des</text>
<text x="44" y="3103" font-size="16" font-weight="400" fill="#161616">informations à examiner</text>
<text x="44" y="3127" font-size="16" font-weight="400" fill="#161616">séparément. Aucun score</text>
<text x="44" y="3151" font-size="16" font-weight="400" fill="#161616">d'attractivité ne les combine.</text>
