<text x="24" y="282" font-size="30" font-weight="700" fill="#161616">Où explorer les</text>
<text x="24" y="327" font-size="30" font-weight="700" fill="#161616">opportunités ?</text>
<text x="24" y="370" font-size="16" font-weight="400" fill="#666">Choisir un périmètre de comparaison,</text>
<text x="24" y="394" font-size="16" font-weight="400" fill="#666">sans mélanger les familles ni les</text>
<text x="24" y="418" font-size="16" font-weight="400" fill="#666">périodes.</text>
<rect x="24" y="450" width="342" height="48" fill="#000091" stroke="#000091"/>
<a href="pistes.svg" aria-label="Garder cette piste">
<text x="40" y="478" font-size="16" font-weight="700" fill="#fff">Garder cette piste</text>
</a>
