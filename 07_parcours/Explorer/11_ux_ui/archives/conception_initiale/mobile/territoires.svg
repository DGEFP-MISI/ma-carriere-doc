<text x="44" y="1638" font-size="16" font-weight="400" fill="#161616">88,4 %</text>
<rect x="24" y="1682" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1714" font-size="12" font-weight="700" fill="#666">Région</text>
<text x="44" y="1736" font-size="16" font-weight="700" fill="#161616">3. ILE-DE-FRANCE</text>
