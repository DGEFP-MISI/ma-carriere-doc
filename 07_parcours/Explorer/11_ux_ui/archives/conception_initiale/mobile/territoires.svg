</a>
<text x="24" y="658" font-size="16" font-weight="700" fill="#161616">Territoire de consultation</text>
<text x="24" y="680" font-size="14" font-weight="400" fill="#666">Le bassin, le département et la région</text>
<text x="24" y="701" font-size="14" font-weight="400" fill="#666">portent des mesures différentes.</text>
<rect x="24" y="716" width="342" height="48" fill="#eee" stroke="none"/>
<text x="36" y="744" font-size="16" font-weight="400" fill="#161616">Montpellier — commune — Hérault</text>
<path d="M24 764H366" stroke="#161616" stroke-width="2"/>
<rect x="24" y="788" width="342" height="216" fill="#ececfe" stroke="none"/>
<text x="44" y="824" font-size="16" font-weight="700" fill="#161616">Les classements ne sont pas des</text>
<text x="44" y="848" font-size="16" font-weight="700" fill="#161616">données communales</text>
<text x="44" y="880" font-size="16" font-weight="400" fill="#161616">Projets : régions, départements</text>
<text x="44" y="904" font-size="16" font-weight="400" fill="#161616">ou bassins. Salaires : régions</text>
<text x="44" y="928" font-size="16" font-weight="400" fill="#161616">ou départements. Chaque</text>
<text x="44" y="952" font-size="16" font-weight="400" fill="#161616">changement de périmètre est</text>
<text x="44" y="976" font-size="16" font-weight="400" fill="#161616">annoncé.</text>
<text x="24" y="1040" font-size="12" font-weight="700" fill="#666">Vues disponibles</text>
<rect x="24" y="1054" width="4" height="32" fill="#000091" stroke="none"/>
<text x="40" y="1070" font-size="16" font-weight="700" fill="#000091">● Projets de recrutement</text>
<rect x="24" y="1090" width="4" height="32" fill="#ddd" stroke="none"/>
<text x="40" y="1106" font-size="16" font-weight="400" fill="#000091">○ Salaires médians</text>
<text x="24" y="1182" font-size="24" font-weight="700" fill="#161616">Projets BMO par région</text>
<text x="24" y="1218" font-size="16" font-weight="400" fill="#666">Couvreurs · B1X34 · 1 métier ·</text>
<text x="24" y="1242" font-size="16" font-weight="400" fill="#666">France Travail 2026.</text>
<rect x="24" y="1270" width="342" height="190" fill="#f6f6f6" stroke="none"/>
