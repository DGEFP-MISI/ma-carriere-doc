<text x="40" y="765" font-size="16" font-weight="400" fill="#000091">○ D'où viennent-elles ?</text>
<rect x="24" y="801" width="342" height="48" fill="#fff" stroke="#000091"/>
<text x="40" y="829" font-size="16" font-weight="700" fill="#000091">France · Modifier</text>
<rect x="24" y="861" width="342" height="48" fill="#fff" stroke="#000091"/>
<text x="40" y="889" font-size="16" font-weight="700" fill="#000091">Tous âges · Modifier</text>
<rect x="24" y="921" width="342" height="48" fill="#fff" stroke="#000091"/>
<text x="40" y="949" font-size="16" font-weight="700" fill="#000091">Famille B0Z21</text>
<rect x="24" y="981" width="342" height="192" fill="#ececfe" stroke="none"/>
<text x="44" y="1017" font-size="16" font-weight="700" fill="#161616">Des situations de famille</text>
<text x="44" y="1041" font-size="16" font-weight="700" fill="#161616">professionnelle</text>
<text x="44" y="1073" font-size="16" font-weight="400" fill="#161616">B0Z21 : ouvriers non qualifiés</text>
<text x="44" y="1097" font-size="16" font-weight="400" fill="#161616">du gros œuvre · 8 métiers. Même</text>
<text x="44" y="1121" font-size="16" font-weight="400" fill="#161616">famille ne signifie pas</text>
<text x="44" y="1145" font-size="16" font-weight="400" fill="#161616">nécessairement même poste.</text>
<text x="24" y="1221" font-size="24" font-weight="700" fill="#161616">Situation un an après —</text>
<text x="24" y="1257" font-size="24" font-weight="700" fill="#161616">France</text>
<text x="24" y="1305" font-size="16" font-weight="700" fill="#161616">Même famille professionnelle</text>
<text x="24" y="1329" font-size="16" font-weight="400" fill="#161616">55,3 %</text>
<rect x="24" y="1341" width="342" height="8" fill="#eee" stroke="none"/>
<rect x="24" y="1341" width="189.12599999999998" height="8" fill="#000091" stroke="none"/>
<text x="24" y="1385" font-size="16" font-weight="700" fill="#161616">Demandeurs d'emploi</text>
<text x="24" y="1409" font-size="16" font-weight="400" fill="#161616">11 %</text>
<rect x="24" y="1421" width="342" height="8" fill="#eee" stroke="none"/>
<rect x="24" y="1421" width="37.62" height="8" fill="#000091" stroke="none"/>
<text x="24" y="1465" font-size="16" font-weight="700" fill="#161616">Autres situations</text>
<text x="24" y="1489" font-size="16" font-weight="400" fill="#161616">10,3 %</text>
<rect x="24" y="1501" width="342" height="8" fill="#eee" stroke="none"/>
<rect x="24" y="1501" width="35.226000000000006" height="8" fill="#000091" stroke="none"/>
<text x="24" y="1545" font-size="16" font-weight="700" fill="#161616">Maçons</text>
<text x="24" y="1569" font-size="16" font-weight="400" fill="#161616">3,7 %</text>
<rect x="24" y="1581" width="342" height="8" fill="#eee" stroke="none"/>
<rect x="24" y="1581" width="12.654000000000002" height="8" fill="#000091" stroke="none"/>
<text x="24" y="1625" font-size="16" font-weight="700" fill="#161616">Ouvriers qualifiés des travaux</text>
<text x="24" y="1649" font-size="16" font-weight="700" fill="#161616">publics, du béton et de l'extraction</text>
<text x="24" y="1673" font-size="16" font-weight="400" fill="#161616">1,6 %</text>
<rect x="24" y="1685" width="342" height="8" fill="#eee" stroke="none"/>
<rect x="24" y="1685" width="5.472" height="8" fill="#000091" stroke="none"/>
<text x="24" y="1725" font-size="12" font-weight="400" fill="#666">Échelle commune : 0 à 100 %</text>
<rect x="24" y="1755" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1787" font-size="12" font-weight="700" fill="#666">Situation un an avant</text>
<text x="44" y="1809" font-size="16" font-weight="700" fill="#161616">Même famille</text>
<text x="44" y="1841" font-size="12" font-weight="700" fill="#666">Part reçue</text>
<text x="44" y="1863" font-size="16" font-weight="400" fill="#161616">54 %</text>
<text x="44" y="1895" font-size="12" font-weight="700" fill="#666">Population</text>
<text x="44" y="1917" font-size="16" font-weight="400" fill="#161616">France · tous âges · B0Z21</text>
<rect x="24" y="1961" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1993" font-size="12" font-weight="700" fill="#666">Situation un an avant</text>
<text x="44" y="2015" font-size="16" font-weight="700" fill="#161616">Autres situations</text>
<text x="44" y="2047" font-size="12" font-weight="700" fill="#666">Part reçue</text>
<text x="44" y="2069" font-size="16" font-weight="400" fill="#161616">15 %</text>
<text x="44" y="2101" font-size="12" font-weight="700" fill="#666">Population</text>
<text x="44" y="2123" font-size="16" font-weight="400" fill="#161616">France · tous âges · B0Z21</text>
<rect x="24" y="2167" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2199" font-size="12" font-weight="700" fill="#666">Situation un an avant</text>
<text x="44" y="2221" font-size="16" font-weight="700" fill="#161616">Demandeurs d'emploi</text>
<text x="44" y="2253" font-size="12" font-weight="700" fill="#666">Part reçue</text>
<text x="44" y="2275" font-size="16" font-weight="400" fill="#161616">8,4 %</text>
<text x="44" y="2307" font-size="12" font-weight="700" fill="#666">Population</text>
<text x="44" y="2329" font-size="16" font-weight="400" fill="#161616">France · tous âges · B0Z21</text>
<rect x="24" y="2373" width="342" height="80" fill="#f6f6f6" stroke="none"/>
<text x="40" y="2405" font-size="16" font-weight="700" fill="#000091">+ Autre famille rattachée :</text>
<text x="40" y="2429" font-size="16" font-weight="700" fill="#000091">Couvreurs (B2Z44)</text>
<text x="24" y="2483" font-size="14" font-weight="400" fill="#666">Les situations les plus fréquentes sont</text>
<text x="24" y="2504" font-size="14" font-weight="400" fill="#666">publiées, au plus 15 par famille. Des</text>
<text x="24" y="2525" font-size="14" font-weight="400" fill="#666">parts sont omises pour secret statistique</text>
<text x="24" y="2546" font-size="14" font-weight="400" fill="#666">: la somme affichée peut être inférieure</text>
<text x="24" y="2567" font-size="14" font-weight="400" fill="#666">à 100 %.</text>
<text x="24" y="2612" font-size="14" font-weight="400" fill="#666">DARES · ForCE et DSN-Sismmo · 2022–2023.</text>
<text x="24" y="2633" font-size="14" font-weight="400" fill="#666">Âge en début de période pour les</text>
<text x="24" y="2654" font-size="14" font-weight="400" fill="#666">destinations, en fin pour les origines.</text>
<text x="24" y="2675" font-size="14" font-weight="400" fill="#666">Les FAP ne sont pas des codes ROME</text>
<text x="24" y="2696" font-size="14" font-weight="400" fill="#666">ouvrables automatiquement.</text>
