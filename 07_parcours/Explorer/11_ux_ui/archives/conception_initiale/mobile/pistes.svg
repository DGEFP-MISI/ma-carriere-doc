<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1970" viewBox="0 0 390 1970" role="img" aria-labelledby="title desc"><title id="title">Mes pistes, pour poursuivre l'exploration</title><desc id="desc">Maquette mobile éditable, colonne de 390 pixels. Les liens de navigation mènent aux autres SVG ; les formulaires sont représentés visuellement.</desc><rect width="390" height="1970" fill="#fff"/><g font-family="Marianne, Arial, sans-serif"><rect x="0" y="0" width="390" height="96" fill="#fff" stroke="none"/>
<path d="M0 95H390" stroke="#ddd"/>
<text x="24" y="40" font-size="20" font-weight="700" fill="#161616">MaCarrière</text>
<text x="24" y="64" font-size="14" font-weight="400" fill="#666">Explorer · maquette mobile</text>
<rect x="24" y="120" width="342" height="48" fill="#fff" stroke="#000091"/>
<a href="recherche.svg" aria-label="Explorer">
<text x="40" y="148" font-size="16" font-weight="700" fill="#000091">Explorer</text>
