<text x="24" y="327" font-size="30" font-weight="700" fill="#161616">travaille-t-on ?</text>
<text x="24" y="370" font-size="16" font-weight="400" fill="#666">Distinguer les secteurs d'emploi de</text>
<text x="24" y="394" font-size="16" font-weight="400" fill="#666">la famille et la dynamique</text>
<text x="24" y="418" font-size="16" font-weight="400" fill="#666">économique du territoire.</text>
