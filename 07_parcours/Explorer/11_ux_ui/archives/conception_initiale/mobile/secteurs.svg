<text x="24" y="682" font-size="24" font-weight="700" fill="#161616">Secteurs de la famille</text>
<text x="24" y="718" font-size="24" font-weight="700" fill="#161616">B0Z21</text>
<text x="24" y="754" font-size="16" font-weight="400" fill="#666">Occitanie · actifs occupés salariés</text>
<text x="24" y="778" font-size="16" font-weight="400" fill="#666">et non salariés · 8 métiers · INSEE</text>
<text x="24" y="802" font-size="16" font-weight="400" fill="#666">RP 2021.</text>
<text x="24" y="854" font-size="24" font-weight="700" fill="#161616">Parts d'actifs par</text>
<text x="24" y="890" font-size="24" font-weight="700" fill="#161616">secteur</text>
<text x="24" y="938" font-size="16" font-weight="700" fill="#161616">Construction</text>
<text x="24" y="962" font-size="16" font-weight="400" fill="#161616">77,9 %</text>
<rect x="24" y="974" width="342" height="8" fill="#eee" stroke="none"/>
<rect x="24" y="974" width="266.418" height="8" fill="#000091" stroke="none"/>
<text x="24" y="1018" font-size="16" font-weight="700" fill="#161616">Activités de services administratifs</text>
<text x="24" y="1042" font-size="16" font-weight="700" fill="#161616">et de soutien</text>
<text x="24" y="1066" font-size="16" font-weight="400" fill="#161616">12,1 %</text>
<rect x="24" y="1078" width="342" height="8" fill="#eee" stroke="none"/>
<rect x="24" y="1078" width="41.382" height="8" fill="#000091" stroke="none"/>
<text x="24" y="1122" font-size="16" font-weight="700" fill="#161616">Administration publique</text>
<text x="24" y="1146" font-size="16" font-weight="400" fill="#161616">1,3 %</text>
<rect x="24" y="1158" width="342" height="8" fill="#eee" stroke="none"/>
<rect x="24" y="1158" width="4.446000000000001" height="8" fill="#000091" stroke="none"/>
<text x="24" y="1198" font-size="12" font-weight="400" fill="#666">Échelle commune : 0 à 100 %</text>
<text x="24" y="1268" font-size="24" font-weight="700" fill="#161616">Et le contexte</text>
<text x="24" y="1304" font-size="24" font-weight="700" fill="#161616">économique local ?</text>
<text x="24" y="1340" font-size="16" font-weight="400" fill="#666">Construction · bassin de Montpellier</text>
<text x="24" y="1364" font-size="16" font-weight="400" fill="#666">· tous les salariés privés du</text>
<text x="24" y="1388" font-size="16" font-weight="400" fill="#666">secteur, pas les seuls couvreurs.</text>
<rect x="24" y="1416" width="342" height="176" fill="#fff" stroke="#ddd"/>
<text x="48" y="1456" font-size="16" font-weight="700" fill="#161616">Établissements employeurs</text>
<text x="48" y="1500" font-size="28" font-weight="700" fill="#161616">2 613</text>
<text x="48" y="1540" font-size="14" font-weight="400" fill="#666">Construction · bassin de</text>
<text x="48" y="1561" font-size="14" font-weight="400" fill="#666">Montpellier · URSSAF 2025</text>
<rect x="24" y="1608" width="342" height="176" fill="#fff" stroke="#ddd"/>
<text x="48" y="1648" font-size="16" font-weight="700" fill="#161616">Salariés privés</text>
<text x="48" y="1692" font-size="28" font-weight="700" fill="#161616">16 440</text>
<text x="48" y="1732" font-size="14" font-weight="400" fill="#666">Construction · même territoire et</text>
<text x="48" y="1753" font-size="14" font-weight="400" fill="#666">secteur · URSSAF 2025</text>
<rect x="24" y="1800" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1832" font-size="12" font-weight="700" fill="#666">Dynamique du secteur</text>
<text x="44" y="1854" font-size="16" font-weight="700" fill="#161616">Créations d'établissements</text>
<text x="44" y="1886" font-size="12" font-weight="700" fill="#666">Valeur reçue</text>
<text x="44" y="1908" font-size="16" font-weight="400" fill="#161616">1 469</text>
<text x="44" y="1940" font-size="12" font-weight="700" fill="#666">Période</text>
<text x="44" y="1962" font-size="16" font-weight="400" fill="#161616">2025 · évolution annuelle −9 %</text>
<rect x="24" y="2006" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2038" font-size="12" font-weight="700" fill="#666">Dynamique du secteur</text>
<text x="44" y="2060" font-size="16" font-weight="700" fill="#161616">Évolution des salariés privés</text>
<text x="44" y="2092" font-size="12" font-weight="700" fill="#666">Valeur reçue</text>
<text x="44" y="2114" font-size="16" font-weight="400" fill="#161616">−2 %</text>
<text x="44" y="2146" font-size="12" font-weight="700" fill="#666">Période</text>
<text x="44" y="2168" font-size="16" font-weight="400" fill="#161616">2020–2025</text>
<rect x="24" y="2212" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2244" font-size="12" font-weight="700" fill="#666">Dynamique du secteur</text>
<text x="44" y="2266" font-size="16" font-weight="700" fill="#161616">Défaillances</text>
<text x="44" y="2298" font-size="12" font-weight="700" fill="#666">Valeur reçue</text>
<text x="44" y="2320" font-size="16" font-weight="400" fill="#161616">98</text>
<text x="44" y="2352" font-size="12" font-weight="700" fill="#666">Période</text>
<text x="44" y="2374" font-size="16" font-weight="400" fill="#161616">01/01/2026–30/09/2026</text>
<rect x="24" y="2418" width="342" height="240" fill="#ececfe" stroke="none"/>
<text x="44" y="2454" font-size="16" font-weight="700" fill="#161616">Le détail métier-territoire est</text>
<text x="44" y="2478" font-size="16" font-weight="700" fill="#161616">indisponible sur ce cas</text>
<text x="44" y="2510" font-size="16" font-weight="400" fill="#161616">Le filtre F1610 ne restitue pas</text>
<text x="44" y="2534" font-size="16" font-weight="400" fill="#161616">le résultat attendu. Les</text>
<text x="44" y="2558" font-size="16" font-weight="400" fill="#161616">données familiales et le</text>
<text x="44" y="2582" font-size="16" font-weight="400" fill="#161616">contexte territorial restent</text>
<text x="44" y="2606" font-size="16" font-weight="400" fill="#161616">consultables ; aucun compte</text>
<text x="44" y="2630" font-size="16" font-weight="400" fill="#161616">local n'est attribué au métier.</text>
<text x="24" y="2696" font-size="14" font-weight="400" fill="#666">Parts d'emploi : INSEE RP 2021. Contexte</text>
<text x="24" y="2717" font-size="14" font-weight="400" fill="#666">: SIDE / URSSAF / BODACC, périodes</text>
<text x="24" y="2738" font-size="14" font-weight="400" fill="#666">distinctes. Les lectures accessibles ne</text>
<text x="24" y="2759" font-size="14" font-weight="400" fill="#666">clôturent pas l'anomalie R17.</text>
<rect x="24" y="2790" width="342" height="48" fill="#fff" stroke="#000091"/>
