</a>
<rect x="24" y="687" width="342" height="216" fill="#ececfe" stroke="none"/>
<text x="44" y="723" font-size="16" font-weight="700" fill="#161616">Une donnée familiale pour votre</text>
<text x="44" y="747" font-size="16" font-weight="700" fill="#161616">territoire</text>
<text x="44" y="779" font-size="16" font-weight="400" fill="#161616">La valeur locale reçue concerne</text>
<text x="44" y="803" font-size="16" font-weight="400" fill="#161616">B0Z21, ouvriers non qualifiés</text>
<text x="44" y="827" font-size="16" font-weight="400" fill="#161616">du gros œuvre, commune à 8</text>
<text x="44" y="851" font-size="16" font-weight="400" fill="#161616">métiers. Le lieu mesuré est</text>
<text x="44" y="875" font-size="16" font-weight="400" fill="#161616">l'Hérault, pas la commune.</text>
<rect x="24" y="927" width="342" height="176" fill="#fff" stroke="#ddd"/>
<text x="48" y="967" font-size="16" font-weight="700" fill="#161616">Médiane mensuelle nette</text>
<text x="48" y="1011" font-size="28" font-weight="700" fill="#161616">1 690 €</text>
<text x="48" y="1051" font-size="14" font-weight="400" fill="#666">Famille B0Z21 · Hérault · salariés</text>
<text x="48" y="1072" font-size="14" font-weight="400" fill="#666">à temps complet · INSEE BTS 2023</text>
<text x="24" y="1159" font-size="24" font-weight="700" fill="#161616">Situer les salaires</text>
<text x="24" y="1195" font-size="24" font-weight="700" fill="#161616">annuels</text>
<text x="24" y="1231" font-size="16" font-weight="400" fill="#666">Les quartiles sont annuels : ils ne</text>
<text x="24" y="1255" font-size="16" font-weight="400" fill="#666">sont pas présentés comme mensuels.</text>
<rect x="24" y="1283" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1315" font-size="12" font-weight="700" fill="#666">Salaire net annuel</text>
<text x="44" y="1337" font-size="16" font-weight="700" fill="#161616">Premier quartile (Q1)</text>
<text x="44" y="1369" font-size="12" font-weight="700" fill="#666">Montant reçu</text>
<text x="44" y="1391" font-size="16" font-weight="400" fill="#161616">17 400 €</text>
<text x="44" y="1423" font-size="12" font-weight="700" fill="#666">Lecture</text>
<text x="44" y="1445" font-size="16" font-weight="400" fill="#161616">Un quart des salaires sous</text>
<text x="44" y="1469" font-size="16" font-weight="400" fill="#161616">cette valeur</text>
<rect x="24" y="1513" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1545" font-size="12" font-weight="700" fill="#666">Salaire net annuel</text>
<text x="44" y="1567" font-size="16" font-weight="700" fill="#161616">Médiane</text>
<text x="44" y="1599" font-size="12" font-weight="700" fill="#666">Montant reçu</text>
<text x="44" y="1621" font-size="16" font-weight="400" fill="#161616">20 300 €</text>
<text x="44" y="1653" font-size="12" font-weight="700" fill="#666">Lecture</text>
<text x="44" y="1675" font-size="16" font-weight="400" fill="#161616">La moitié des salaires sous</text>
<text x="44" y="1699" font-size="16" font-weight="400" fill="#161616">cette valeur</text>
<rect x="24" y="1743" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="1775" font-size="12" font-weight="700" fill="#666">Salaire net annuel</text>
<text x="44" y="1797" font-size="16" font-weight="700" fill="#161616">Troisième quartile (Q3)</text>
<text x="44" y="1829" font-size="12" font-weight="700" fill="#666">Montant reçu</text>
<text x="44" y="1851" font-size="16" font-weight="400" fill="#161616">22 000 €</text>
<text x="44" y="1883" font-size="12" font-weight="700" fill="#666">Lecture</text>
<text x="44" y="1905" font-size="16" font-weight="400" fill="#161616">Trois quarts des salaires sous</text>
<text x="44" y="1929" font-size="16" font-weight="400" fill="#161616">cette valeur</text>
<text x="24" y="2013" font-size="24" font-weight="700" fill="#161616">Quels salaires selon le</text>
<text x="24" y="2049" font-size="24" font-weight="700" fill="#161616">secteur économique ?</text>
<text x="24" y="2085" font-size="16" font-weight="400" fill="#666">France · INSEE BTS 2023 · FAP225 ×</text>
<text x="24" y="2109" font-size="16" font-weight="400" fill="#666">NAF38 ; familles séparées.</text>
<rect x="24" y="2137" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2169" font-size="12" font-weight="700" fill="#666">Famille et secteur</text>
<text x="44" y="2191" font-size="16" font-weight="700" fill="#161616">B0Z21 · Construction</text>
<text x="44" y="2223" font-size="12" font-weight="700" fill="#666">Médiane mensuelle</text>
<text x="44" y="2245" font-size="16" font-weight="400" fill="#161616">1 750 €</text>
<text x="44" y="2277" font-size="12" font-weight="700" fill="#666">Part des salariés</text>
<text x="44" y="2299" font-size="16" font-weight="400" fill="#161616">95,3 % · France</text>
<rect x="24" y="2343" width="342" height="214" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2375" font-size="12" font-weight="700" fill="#666">Famille et secteur</text>
<text x="44" y="2397" font-size="16" font-weight="700" fill="#161616">B0Z21 · Activités de services</text>
<text x="44" y="2421" font-size="16" font-weight="700" fill="#161616">administratifs et de soutien</text>
<text x="44" y="2453" font-size="12" font-weight="700" fill="#666">Médiane mensuelle</text>
<text x="44" y="2475" font-size="16" font-weight="400" fill="#161616">1 620 €</text>
<text x="44" y="2507" font-size="12" font-weight="700" fill="#666">Part des salariés</text>
<text x="44" y="2529" font-size="16" font-weight="400" fill="#161616">1,3 % · France</text>
<rect x="24" y="2573" width="342" height="190" fill="#f6f6f6" stroke="none"/>
<text x="44" y="2605" font-size="12" font-weight="700" fill="#666">Famille et secteur</text>
<text x="44" y="2627" font-size="16" font-weight="700" fill="#161616">B2Z44 · Construction</text>
<text x="44" y="2659" font-size="12" font-weight="700" fill="#666">Médiane mensuelle</text>
<text x="44" y="2681" font-size="16" font-weight="400" fill="#161616">2 090 €</text>
<text x="44" y="2713" font-size="12" font-weight="700" fill="#666">Part des salariés</text>
<text x="44" y="2735" font-size="16" font-weight="400" fill="#161616">97,9 % · France</text>
<rect x="24" y="2779" width="342" height="80" fill="#f6f6f6" stroke="none"/>
<text x="40" y="2811" font-size="16" font-weight="700" fill="#000091">+ Quartiles annuels et référence</text>
<text x="40" y="2835" font-size="16" font-weight="700" fill="#000091">tous secteurs</text>
<rect x="24" y="2875" width="342" height="240" fill="#ececfe" stroke="none"/>
<text x="44" y="2911" font-size="16" font-weight="700" fill="#161616">Une sélection de secteurs</text>
<text x="44" y="2935" font-size="16" font-weight="700" fill="#161616">publiée</text>
<text x="44" y="2967" font-size="16" font-weight="400" fill="#161616">Seuls les secteurs au seuil</text>
<text x="44" y="2991" font-size="16" font-weight="400" fill="#161616">figurent. Les parts ne sont pas</text>
<text x="44" y="3015" font-size="16" font-weight="400" fill="#161616">renormalisées. Une médiane non</text>
<text x="44" y="3039" font-size="16" font-weight="400" fill="#161616">chiffrable en tranche ouverte</text>
<text x="44" y="3063" font-size="16" font-weight="400" fill="#161616">est présentée comme tranche</text>
<text x="44" y="3087" font-size="16" font-weight="400" fill="#161616">annuelle.</text>
<rect x="24" y="3139" width="342" height="72" fill="#000091" stroke="#000091"/>
