<text x="24" y="282" font-size="30" font-weight="700" fill="#161616">Combien gagne-t-on,</text>
<text x="24" y="327" font-size="30" font-weight="700" fill="#161616">selon la famille et</text>
<text x="24" y="372" font-size="30" font-weight="700" fill="#161616">le secteur ?</text>
<text x="24" y="415" font-size="16" font-weight="400" fill="#666">Un salaire de famille</text>
<text x="24" y="439" font-size="16" font-weight="400" fill="#666">professionnelle, pas une promesse</text>
<text x="24" y="463" font-size="16" font-weight="400" fill="#666">pour un poste précis.</text>
