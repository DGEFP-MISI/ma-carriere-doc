<text x="40" y="3167" font-size="16" font-weight="700" fill="#fff">Comparer les territoires sur les</text>
<text x="40" y="3191" font-size="16" font-weight="700" fill="#fff">salaires</text>
</a>
<text x="24" y="3237" font-size="14" font-weight="400" fill="#666">INSEE · Base Tous salariés 2023, calculs</text>
<text x="24" y="3258" font-size="14" font-weight="400" fill="#666">RCO. Population et méthode détaillées</text>
<text x="24" y="3279" font-size="14" font-weight="400" fill="#666">dans Sources.</text>
