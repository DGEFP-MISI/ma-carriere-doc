<text x="44" y="1198" font-size="16" font-weight="400" fill="#161616">2,1 % · 26 métier(s)</text>
<text x="24" y="1256" font-size="14" font-weight="400" fill="#666">Projets, pas offres ni embauches. Valeurs</text>
