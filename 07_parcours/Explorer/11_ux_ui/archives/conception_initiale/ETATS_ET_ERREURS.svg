<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1930" viewBox="0 0 1440 1930" role="img" aria-label="Explorer V2 — états et erreurs"><rect width="1440" height="1930" fill="white"/><g font-family="Marianne, Arial, sans-serif"><text x="48" y="65" font-size="36" font-weight="700">Explorer V2 — états et erreurs</text><text x="48" y="105" font-size="17">Messages proposés et règles de restitution. Une simulation visuelle ne vaut pas un test HTTP.</text><rect x="48" y="160" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="192" font-size="20" font-weight="700" fill="#000091">Chargement initial</text><text x="68" y="234" font-size="15" fill="#161616">Titre et lieu visibles. « Chargement des</text><text x="68" y="256" font-size="15" fill="#161616">données… ». Aucun zéro ni graphique fictif.</text>
<rect x="500" y="160" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="192" font-size="20" font-weight="700" fill="#000091">Erreur d'une section</text><text x="520" y="234" font-size="15" fill="#161616">« Ces données n'ont pas pu être chargées.</text><text x="520" y="256" font-size="15" fill="#161616">Réessayer. » Conserver les autres sections et</text><text x="520" y="278" font-size="15" fill="#161616">leurs dates.</text>
<rect x="952" y="160" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="972" y="192" font-size="20" font-weight="700" fill="#000091">Aucun résultat</text><text x="972" y="234" font-size="15" fill="#161616">« Aucun résultat pour ces critères. »</text><text x="972" y="256" font-size="15" fill="#161616">Modifier un choix ou explorer un domaine.</text><text x="972" y="278" font-size="15" fill="#161616">Aucun métier inventé.</text>
<rect x="48" y="510" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="542" font-size="20" font-weight="700" fill="#000091">Valeur null / clé absente</text><text x="68" y="584" font-size="15" fill="#161616">« Non renseigné ». Conserver source,</text><text x="68" y="606" font-size="15" fill="#161616">périmètre et explication ; aucun calcul de</text><text x="68" y="628" font-size="15" fill="#161616">remplacement.</text>
<rect x="500" y="510" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="542" font-size="20" font-weight="700" fill="#000091">Zéro publié</text><text x="520" y="584" font-size="15" fill="#161616">Afficher 0. Certification112561 : abandon des</text><text x="520" y="606" font-size="15" fill="#161616">demandeurs d'emploi publié à0. Ne pas masquer</text><text x="520" y="628" font-size="15" fill="#161616">comme donnée absente.</text>
<rect x="952" y="510" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="972" y="542" font-size="20" font-weight="700" fill="#000091">Secret statistique</text><text x="972" y="584" font-size="15" fill="#161616">« Non diffusé — secret statistique ». Pas de</text><text x="972" y="606" font-size="15" fill="#161616">barre de longueur0, ni de valeur cachée dans</text><text x="972" y="628" font-size="15" fill="#161616">une infobulle.</text>
<rect x="48" y="860" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="892" font-size="20" font-weight="700" fill="#000091">Repli territorial</text><text x="68" y="934" font-size="15" fill="#161616">« Donnée disponible pour l'Hérault ».</text><text x="68" y="956" font-size="15" fill="#161616">Montpellier reste le lieu demandé, Hérault le</text><text x="68" y="978" font-size="15" fill="#161616">lieu mesuré.</text>
<rect x="500" y="860" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="892" font-size="20" font-weight="700" fill="#000091">Plusieurs familles</text><text x="520" y="934" font-size="15" fill="#161616">Libellé/code FAP et nombre de métiers si</text><text x="520" y="956" font-size="15" fill="#161616">reçu. Aucune addition ou moyenne entre</text><text x="520" y="978" font-size="15" fill="#161616">observations.</text>
<rect x="952" y="860" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="972" y="892" font-size="20" font-weight="700" fill="#000091">Pagination incomplète</text><text x="972" y="934" font-size="15" fill="#161616">« 100 compétences reçues sur144 ». Charger la</text><text x="972" y="956" font-size="15" fill="#161616">suite ; comparaison exhaustive après collecte</text><text x="972" y="978" font-size="15" fill="#161616">complète.</text>
<rect x="48" y="1210" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="1242" font-size="20" font-weight="700" fill="#000091">Anomalie R17</text><text x="68" y="1284" font-size="15" fill="#161616">Détail métier-territoire indisponible.</text><text x="68" y="1306" font-size="15" fill="#161616">Contexte économique et emploi familial</text><text x="68" y="1328" font-size="15" fill="#161616">distincts. Aucun raccordement inventé.</text>
<rect x="500" y="1210" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="1242" font-size="20" font-weight="700" fill="#000091">Sessions / places</text><text x="520" y="1284" font-size="15" fill="#161616">Dates et organisme publiés ; places</text><text x="520" y="1306" font-size="15" fill="#161616">disponibles non fournies. Aucun lien</text><text x="520" y="1328" font-size="15" fill="#161616">d'inscription inventé.</text>
<rect x="952" y="1210" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="972" y="1242" font-size="20" font-weight="700" fill="#000091">429 / 503 / réseau</text><text x="972" y="1284" font-size="15" fill="#161616">Message compréhensible et reprise bornée.</text><text x="972" y="1306" font-size="15" fill="#161616">Valeur ancienne datée si disponible ; aucune</text><text x="972" y="1328" font-size="15" fill="#161616">relance infinie.</text>
<rect x="48" y="1560" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="68" y="1592" font-size="20" font-weight="700" fill="#000091">Non comparable</text><text x="68" y="1634" font-size="15" fill="#161616">Deux colonnes documentées, « Périmètres</text><text x="68" y="1656" font-size="15" fill="#161616">différents ». Pas de delta, vainqueur ou</text><text x="68" y="1678" font-size="15" fill="#161616">égalité supposée.</text>
<rect x="500" y="1560" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="520" y="1592" font-size="20" font-weight="700" fill="#000091">Tranche annuelle ouverte</text><text x="520" y="1634" font-size="15" fill="#161616">Afficher le libellé reçu et l'unité annuelle.</text><text x="520" y="1656" font-size="15" fill="#161616">Aucun centre de tranche ou salaire mensuel</text><text x="520" y="1678" font-size="15" fill="#161616">calculé.</text>
<rect x="952" y="1560" width="420" height="320" fill="#f6f6f6" stroke="#ddd"/><text x="972" y="1592" font-size="20" font-weight="700" fill="#000091">Mes pistes vide / retrait</text><text x="972" y="1634" font-size="15" fill="#161616">Invitation à explorer ; annonce accessible du</text><text x="972" y="1656" font-size="15" fill="#161616">retrait ; retour du focus logique ; durée</text><text x="972" y="1678" font-size="15" fill="#161616">explicitée.</text></g></svg>
